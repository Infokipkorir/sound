<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity Logs — SoundsCare Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/sidebar.css"><link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/modal.css"><link rel="stylesheet" href="css/tables.css"><link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/forms.css"><link rel="stylesheet" href="css/responsive.css">
</head><body data-page="activity-logs">
<div id="maintenance-banner"><i class="bi bi-exclamation-triangle-fill"></i> Maintenance mode is ON.</div>
<div data-include="sidebar"></div>
<div class="main" id="main">
  <div data-include="topbar"></div>
  <div class="content">
    <div class="page-head"><div><h1>Activity Logs</h1><p>Admin actions across the platform (deletes, approvals, edits)</p></div></div>
    <div class="section">
      <div class="search-bar">
        <input class="search-input" id="log-search" placeholder="🔍 Search description or table…" oninput="filterActivityLogs()">
      </div>
      <div class="table-wrap"><table><thead><tr><th>Action</th><th>Description</th><th>Target</th><th>When</th></tr></thead>
      <tbody id="log-tbody"><tr><td colspan="4" style="text-align:center">Loading…</td></tr></tbody></table></div>
      <div class="pagination" id="log-pagination"></div>
    </div>
  </div>
</div>
<div data-include="modal"></div><div data-include="toast"></div>
<script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/layout.js"></script>
<script src="js/auth.js"></script><script src="js/api.js"></script><script src="js/activity-logs.js"></script>
<script>(async function(){await initLayout();const admin=await requireAuth();if(!admin)return;await initActivityLogsPage();})();</script>
</body></html>

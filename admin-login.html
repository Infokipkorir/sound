<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login – SoundsCare</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --brand: #1B6B45; --brand-dark: #134f33; --brand-soft: rgba(27,107,69,0.10);
  --accent: #E8A040; --border: #e5e7eb; --muted: #6b7280; --ink: #0f1923;
  --bg: #ffffff; --surface: #ffffff;
  --red-bg: #FCEBEB; --red-border: #f43f5e; --red-text: #be123c;
  --info-bg: #EFF6FF; --info-border: #BAD6F9; --info-text: #1E4A8A;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', -apple-system, sans-serif;
  background: var(--bg); color: var(--ink);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 2rem 1rem;
}
.auth-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 22px;
  padding: 2.6rem 2.2rem 2rem; max-width: 420px; width: 100%;
  box-shadow: 0 4px 32px rgba(15,25,35,.07); position: relative; overflow: hidden;
}
.auth-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, var(--brand), var(--accent));
}
.auth-logo-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 1.4rem; }
.auth-logo {
  width: 64px; height: 64px; background: #fff; border: 1.5px solid var(--border); border-radius: 16px;
  display: flex; align-items: center; justify-content: center; margin: 0 auto .8rem;
  box-shadow: 0 6px 20px rgba(27,107,69,.15); font-size: 26px;
}
h1 { text-align: center; font-size: 1.3rem; font-weight: 800; letter-spacing: -.3px; margin-bottom: 2px; }
.subtitle { text-align: center; font-size: 12.5px; color: var(--muted); margin-bottom: 1.5rem; line-height: 1.5; }
.subtitle b { color: var(--ink); }

.form-group { margin-bottom: 1rem; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
.form-group input {
  width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 10px;
  font-size: 14px; font-family: inherit; outline: none; background: #FAFBFB; color: var(--ink);
  transition: border .15s, box-shadow .15s;
}
.form-group input:focus { border-color: var(--brand); background: #fff; box-shadow: 0 0 0 3px var(--brand-soft); }

.otp-row { display: flex; gap: 8px; justify-content: space-between; margin: 1.2rem 0 .4rem; }
.otp-box {
  width: 46px; height: 54px; text-align: center; font-size: 22px; font-weight: 700; font-family: inherit;
  border: 1.5px solid var(--border); border-radius: 10px; background: #FAFBFB; color: var(--ink); outline: none;
  transition: border .15s, box-shadow .15s;
}
.otp-box:focus { border-color: var(--brand); background: #fff; box-shadow: 0 0 0 3px var(--brand-soft); }
.otp-box.filled { border-color: var(--brand); }
.otp-box.inp-error { border-color: var(--red-border) !important; box-shadow: 0 0 0 3px rgba(244,63,94,.09) !important; }

.resend-row { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: .8rem; }
.resend-row a { color: var(--brand); font-weight: 500; text-decoration: none; cursor: pointer; }
.resend-row a:hover { text-decoration: underline; }
.resend-row a.disabled { color: var(--muted); pointer-events: none; text-decoration: none; }

.btn-primary {
  width: 100%; background: var(--brand); color: #fff; border: none; border-radius: 10px; padding: 13px;
  font-size: 14.5px; font-family: inherit; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: .2rem;
  transition: background .15s, transform .1s; text-decoration: none;
}
.btn-primary:hover:not(:disabled) { background: var(--brand-dark); }
.btn-primary:active:not(:disabled) { transform: scale(.99); }
.btn-primary:disabled { opacity: .6; cursor: not-allowed; }
.btn-secondary {
  width: 100%; background: transparent; color: var(--muted); border: 1.5px solid var(--border); border-radius: 10px;
  padding: 11px; font-size: 13px; font-family: inherit; font-weight: 500; cursor: pointer; margin-top: .6rem;
  transition: border .15s, color .15s;
}
.btn-secondary:hover { border-color: var(--brand); color: var(--brand-dark); }
.btn-spinner {
  width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%;
  animation: spin .65s linear infinite; display: none;
}
@keyframes spin { to { transform: rotate(360deg); } }

.alert { display: none; border-radius: 10px; padding: 11px 14px; font-size: 13px; margin-top: 12px; text-align: center; line-height: 1.5; }
.alert.error { background: var(--red-bg); border: 1px solid var(--red-border); color: var(--red-text); }
.alert.info  { background: var(--info-bg); border: 1px solid var(--info-border); color: var(--info-text); }

.portal-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 1rem; }
.portal-btn {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1.5px solid var(--border);
  border-radius: 12px; background: #FAFBFB; text-decoration: none; color: var(--ink); font-weight: 600;
  font-size: 14px; transition: border .15s, background .15s;
}
.portal-btn:hover { border-color: var(--brand); background: var(--brand-soft); }
.portal-btn i { font-size: 20px; color: var(--brand); }
.portal-btn small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; margin-top: 1px; }

.footnote { text-align: center; font-size: 11px; color: var(--muted); margin-top: 1.2rem; }
.footnote i { margin-right: 4px; }
</style>
</head>
<body>
<div class="auth-card">
  <div class="auth-logo-wrap">
    <div class="auth-logo">🎙️</div>
    <h1>SoundsCare Admin</h1>
  </div>

  <!-- STEP 1: EMAIL -->
  <div id="view-email">
    <p class="subtitle">Enter your admin email to receive a 6-digit login code.</p>
    <div class="form-group">
      <label>Admin Email</label>
      <input type="email" id="email" placeholder="you@soundscare.com" autocomplete="username" onkeydown="if(event.key==='Enter')sendCode()">
    </div>
    <button class="btn-primary" id="send-btn" onclick="sendCode()">
      <span class="btn-spinner" id="send-spinner"></span>
      <span id="send-text">Send Login Code</span>
    </button>
    <div class="alert" id="email-alert"></div>
  </div>

  <!-- STEP 2: OTP -->
  <div id="view-otp" style="display:none;">
    <p class="subtitle">Enter the 6-digit code sent to <b id="otp-email-display"></b>.</p>
    <div class="otp-row" id="otp-row">
      <input class="otp-box" maxlength="1" inputmode="numeric" autocomplete="one-time-code" data-idx="0">
      <input class="otp-box" maxlength="1" inputmode="numeric" data-idx="1">
      <input class="otp-box" maxlength="1" inputmode="numeric" data-idx="2">
      <input class="otp-box" maxlength="1" inputmode="numeric" data-idx="3">
      <input class="otp-box" maxlength="1" inputmode="numeric" data-idx="4">
      <input class="otp-box" maxlength="1" inputmode="numeric" data-idx="5">
    </div>

    <div class="resend-row">Didn't get it? <a id="resend-link" onclick="sendCode(true)">Resend code</a></div>

    <button class="btn-primary" id="verify-btn" onclick="verifyCode()" style="margin-top:1rem;">
      <span class="btn-spinner" id="verify-spinner"></span>
      <span id="verify-text">Verify & Sign In</span>
    </button>
    <button class="btn-secondary" onclick="show('email')">← Use a different email</button>

    <div class="alert" id="otp-alert"></div>
  </div>

  <!-- STEP 3: CHOOSE PORTAL (super admin, or any admin with >1 page) -->
  <div id="view-portal" style="display:none;">
    <p class="subtitle">Signed in as <b id="portal-email-display"></b>. Choose where to go:</p>
    <div class="portal-grid" id="portal-grid"></div>
  </div>

  <div class="footnote"><i class="bi bi-shield-lock"></i>Secured connection — admin only</div>
</div>

<script>
const SUPABASE_URL = 'https://phoahudvrcelfrykoeuo.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBob2FodWR2cmNlbGZyeWtvZXVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDY0MTMsImV4cCI6MjA5NDQyMjQxM30.xBKbHIttK__d_jQFLavYyJQilUGUFISiWrh8-hgIA9Y';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const PAGE_META = {
  'admin-dashboard': { label: 'Admin Dashboard', hint: 'Full control centre', icon: 'bi-speedometer2', url: 'admin-dashboard.html' },
  'support-room':    { label: 'Support Room',    hint: 'Live chat & tickets', icon: 'bi-headset',       url: 'support-room.html' },
  'cashier':         { label: 'Cashier',         hint: 'Payments & payouts',  icon: 'bi-cash-coin',      url: 'cashier.html' }
};

let currentEmail = '';
let resendTimer = null;

function show(view) {
  ['email','otp','portal'].forEach(v => {
    document.getElementById('view-' + v).style.display = v === view ? '' : 'none';
  });
}

// ── STEP 1: PRECHECK + SEND OTP ───────────────────────────
async function sendCode(isResend = false) {
  const email = isResend ? currentEmail : document.getElementById('email').value.trim();
  const alertEl = isResend ? document.getElementById('otp-alert') : document.getElementById('email-alert');
  alertEl.style.display = 'none';

  if (!email || !/^\S+@\S+\.\S+$/.test(email)) {
    flash(document.getElementById('email-alert'), 'error', '❌ Please enter a valid email address.');
    show('email');
    return;
  }

  if (!isResend) setSendLoading(true);

  const { data: isAdmin, error: precheckErr } = await db.rpc('admin_precheck', { p_email: email });

  if (precheckErr || !isAdmin) {
    if (!isResend) setSendLoading(false);
    flash(document.getElementById('email-alert'), 'error', '❌ This email is not registered for admin access.');
    show('email');
    return;
  }

  const { error } = await db.auth.signInWithOtp({
    email,
    options: { shouldCreateUser: true }
  });

  if (!isResend) setSendLoading(false);

  if (error) {
    flash(alertEl, 'error', '❌ ' + (error.message || 'Could not send the code. Please try again.'));
    return;
  }

  currentEmail = email;
  document.getElementById('otp-email-display').textContent = email;
  clearOtpBoxes();
  show('otp');
  flash(document.getElementById('otp-alert'), 'info', 'ℹ️ A 6-digit code has been sent to your email.');
  startResendCooldown();
}

function startResendCooldown(seconds = 45) {
  const link = document.getElementById('resend-link');
  link.classList.add('disabled');
  let remaining = seconds;
  link.textContent = `Resend code (${remaining}s)`;
  clearInterval(resendTimer);
  resendTimer = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(resendTimer);
      link.classList.remove('disabled');
      link.textContent = 'Resend code';
    } else {
      link.textContent = `Resend code (${remaining}s)`;
    }
  }, 1000);
}

function setSendLoading(on) {
  document.getElementById('send-btn').disabled = on;
  document.getElementById('send-spinner').style.display = on ? 'block' : 'none';
  document.getElementById('send-text').textContent = on ? 'Sending…' : 'Send Login Code';
}

// ── STEP 2: OTP BOXES ─────────────────────────────────────
const otpBoxes = () => Array.from(document.querySelectorAll('.otp-box'));

function clearOtpBoxes() {
  otpBoxes().forEach(b => { b.value = ''; b.classList.remove('filled', 'inp-error'); });
  otpBoxes()[0].focus();
}

otpBoxes().forEach((box, idx) => {
  box.addEventListener('input', () => {
    box.value = box.value.replace(/[^0-9]/g, '');
    box.classList.toggle('filled', box.value.length === 1);
    if (box.value && idx < otpBoxes().length - 1) otpBoxes()[idx + 1].focus();
  });
  box.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !box.value && idx > 0) otpBoxes()[idx - 1].focus();
    if (e.key === 'Enter') verifyCode();
  });
  box.addEventListener('paste', (e) => {
    e.preventDefault();
    const pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
    if (!pasted) return;
    const boxes = otpBoxes();
    pasted.split('').slice(0, boxes.length).forEach((ch, i) => {
      boxes[i].value = ch;
      boxes[i].classList.add('filled');
    });
    const nextEmpty = boxes.findIndex(b => !b.value);
    (nextEmpty === -1 ? boxes[boxes.length - 1] : boxes[nextEmpty]).focus();
  });
});

async function verifyCode() {
  const code = otpBoxes().map(b => b.value).join('');
  const alertEl = document.getElementById('otp-alert');
  alertEl.style.display = 'none';

  if (code.length !== 6) {
    otpBoxes().forEach(b => b.classList.add('inp-error'));
    flash(alertEl, 'error', 'Enter all 6 digits.');
    return;
  }

  setVerifyLoading(true);

  const { error: verifyErr } = await db.auth.verifyOtp({
    email: currentEmail,
    token: code,
    type: 'email'
  });

  if (verifyErr) {
    setVerifyLoading(false);
    otpBoxes().forEach(b => b.classList.add('inp-error'));
    flash(alertEl, 'error', '❌ ' + (verifyErr.message || 'Invalid or expired code. Please try again.'));
    return;
  }

  // Link this auth session to the admin_users row (and mirror into public.admin)
  const { data: linked, error: linkErr } = await db.rpc('link_my_admin_account');

  setVerifyLoading(false);

  const adminRow = Array.isArray(linked) ? linked[0] : linked;

  if (linkErr || !adminRow) {
    await db.auth.signOut();
    flash(alertEl, 'error', '❌ This account is not an active admin. Contact your system administrator.');
    return;
  }

  routeToPortal(adminRow);
}

function setVerifyLoading(on) {
  document.getElementById('verify-btn').disabled = on;
  document.getElementById('verify-spinner').style.display = on ? 'block' : 'none';
  document.getElementById('verify-text').textContent = on ? 'Verifying…' : 'Verify & Sign In';
}

// ── STEP 3: ROUTE TO THE RIGHT PAGE(S) ────────────────────
function routeToPortal(adminRow) {
  const pages = adminRow.access_level === 'super_admin'
    ? ['admin-dashboard', 'support-room', 'cashier']
    : (adminRow.allowed_pages || []);

  if (pages.length === 1) {
    window.location.href = PAGE_META[pages[0]].url;
    return;
  }

  if (pages.length === 0) {
    flash(document.getElementById('otp-alert'), 'error', '❌ Your account has no page access configured. Contact your system administrator.');
    return;
  }

  document.getElementById('portal-email-display').textContent = adminRow.email;
  const grid = document.getElementById('portal-grid');
  grid.innerHTML = pages.map(p => {
    const m = PAGE_META[p];
    return `<a class="portal-btn" href="${m.url}"><i class="bi ${m.icon}"></i><span>${m.label}<small>${m.hint}</small></span></a>`;
  }).join('');
  show('portal');
}

function flash(el, type, msg) {
  el.textContent = msg;
  el.className = 'alert ' + type;
  el.style.display = 'block';
}

show('email');
</script>
</body>
</html>

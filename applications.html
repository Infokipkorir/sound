<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applications — SoundsCare Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/tables.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="applications">

<div id="maintenance-banner"><i class="bi bi-exclamation-triangle-fill"></i> Maintenance mode is ON.</div>
<div data-include="sidebar"></div>

<div class="main" id="main">
  <div data-include="topbar"></div>
  <div class="content">
    <div class="page-head">
      <div><h1>Applications</h1><p id="apps-subtitle">All job applications</p></div>
      <a class="btn btn-secondary btn-sm" href="jobs.html" id="apps-clear-filter" style="display:none"><i class="bi bi-x-lg"></i> Clear job filter</a>
    </div>
    <div class="section">
      <div class="search-bar">
        <input class="search-input" id="apps-search" placeholder="🔍 Search candidate name…" oninput="filterApplications()">
        <select class="filter-select" id="apps-status-filter" onchange="filterApplications()">
          <option value="">All Statuses</option>
          <option value="pending">Pending</option>
          <option value="shortlisted">Shortlisted</option>
          <option value="hired">Hired</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Candidate</th><th>Job</th><th>Employer</th><th>Status</th><th>Applied</th><th>Interview</th><th>Actions</th></tr></thead><tbody id="apps-tbody"><tr><td colspan="7" style="text-align:center">Loading…</td></tr></tbody></table></div>
      <div class="pagination" id="apps-pagination"></div>
    </div>
  </div>
</div>

<div data-include="modal"></div>
<div data-include="toast"></div>

<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<script src="js/layout.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/pdf-biodata.js"></script>
<script src="js/applications.js"></script>
<script>
(async function(){
  await initLayout();
  const admin = await requireAuth();
  if(!admin) return;
  await initApplicationsPage();
})();
</script>
</body>
</html>

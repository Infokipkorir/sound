<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — SoundsCare Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/sidebar.css"><link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/modal.css"><link rel="stylesheet" href="css/tables.css"><link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/forms.css"><link rel="stylesheet" href="css/responsive.css">
</head><body data-page="reports">
<div id="maintenance-banner"><i class="bi bi-exclamation-triangle-fill"></i> Maintenance mode is ON.</div>
<div data-include="sidebar"></div>
<div class="main" id="main">
  <div data-include="topbar"></div>
  <div class="content">
    <div class="page-head"><div><h1>Reports</h1><p>Export platform data as CSV, Excel, or PDF</p></div></div>
    <div class="dash-grid">
      <div class="section"><div class="section-header"><div class="section-title"><i class="bi bi-people-fill"></i> Job Seekers</div></div>
        <div class="section-body" style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-secondary btn-sm" onclick="exportReport('worker_profiles','csv')"><i class="bi bi-filetype-csv"></i> CSV</button>
          <button class="btn btn-secondary btn-sm" onclick="exportReport('worker_profiles','xlsx')"><i class="bi bi-file-earmark-excel"></i> Excel</button>
          <button class="btn btn-secondary btn-sm" onclick="exportReport('worker_profiles','pdf')"><i class="bi bi-file-earmark-pdf"></i> PDF</button>
        </div></div>
      <div class="section"><div class="section-header"><div class="section-title"><i class="bi bi-building"></i> Employers</div></div>
        <div class="section-body" style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-secondary btn-sm" onclick="exportReport('employer_profiles','csv')"><i class="bi bi-filetype-csv"></i> CSV</button>
          <button class="btn btn-secondary btn-sm" onclick="exportReport('employer_profiles','xlsx')"><i class="bi bi-file-earmark-excel"></i> Excel</button>
          <button class="btn btn-secondary btn-sm" onclick="exportReport('employer_profiles','pdf')"><i class="bi bi-file-earmark-pdf"></i> PDF</button>
        </div></div>
      <div class="section"><div class="section-header"><div class="section-title"><i class="bi bi-briefcase-fill"></i> Jobs</div></div>
        <div class="section-body" style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-secondary btn-sm" onclick="exportReport('job_postings','csv')"><i class="bi bi-filetype-csv"></i> CSV</button>
          <button class="btn btn-secondary btn-sm" onclick="exportReport('job_postings','xlsx')"><i class="bi bi-file-earmark-excel"></i> Excel</button>
          <button class="btn btn-secondary btn-sm" onclick="exportReport('job_postings','pdf')"><i class="bi bi-file-earmark-pdf"></i> PDF</button>
        </div></div>
      <div class="section"><div class="section-header"><div class="section-title"><i class="bi bi-cash-coin"></i> Payments</div></div>
        <div class="section-body" style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-secondary btn-sm" onclick="exportReport('payments','csv')"><i class="bi bi-filetype-csv"></i> CSV</button>
          <button class="btn btn-secondary btn-sm" onclick="exportReport('payments','xlsx')"><i class="bi bi-file-earmark-excel"></i> Excel</button>
          <button class="btn btn-secondary btn-sm" onclick="exportReport('payments','pdf')"><i class="bi bi-file-earmark-pdf"></i> PDF</button>
        </div></div>
    </div>
  </div>
</div>
<div data-include="modal"></div><div data-include="toast"></div>
<script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/layout.js"></script>
<script src="js/auth.js"></script><script src="js/api.js"></script><script src="js/reports.js"></script>
<script>(async function(){await initLayout();const admin=await requireAuth();if(!admin)return;})();</script>
</body></html>

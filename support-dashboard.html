<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Support Dashboard | SoundsCare</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
/* ============================== TOKENS ============================== */
:root{
  --teal:#0F766E; --teal-deep:#0B4F49; --aqua:#14B8A6; --mist:#EAF6F4;
  --coral:#E0724A; --coral-deep:#B85A38; --gold:#D8A73D; --cream:#FAFAF8;
  --ink:#182420; --ink-soft:#57655F; --line:rgba(20,30,26,0.09);
  --danger:#C0432E; --ok:#2ECC71; --warn:#D8A73D;
  --sidebar-w:230px;
  --body:'Inter','Plus Jakarta Sans','Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:var(--body); color:var(--ink); background:var(--cream);
  display:flex; overflow:hidden;
}
button{font-family:inherit;}
a{color:var(--teal); text-decoration:none;}
::-webkit-scrollbar{width:7px; height:7px;}
::-webkit-scrollbar-thumb{background:rgba(15,118,110,.18); border-radius:999px;}

/* ============================== SIDEBAR ============================== */
.sd-sidebar{
  width:var(--sidebar-w); flex-shrink:0; background:linear-gradient(180deg,var(--teal-deep),var(--teal) 70%);
  color:#fff; display:flex; flex-direction:column; height:100vh;
}
.sd-brand{display:flex; align-items:center; gap:.6rem; padding:1.1rem 1.1rem .9rem; font-weight:800; font-size:1.02rem;}
.sd-brand .ic{width:34px; height:34px; border-radius:10px; background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center; font-size:1.1rem;}
.sd-nav{flex:1; overflow-y:auto; padding:.4rem .7rem;}
.sd-nav-label{font-size:.66rem; text-transform:uppercase; letter-spacing:.09em; opacity:.6; font-weight:700; margin:.9rem .5rem .35rem;}
.sd-nav a, .sd-nav button.sd-navlink{
  display:flex; align-items:center; gap:.65rem; width:100%; text-align:left; border:none; background:none;
  color:rgba(255,255,255,.86); padding:.55rem .6rem; border-radius:10px; font-size:.85rem; font-weight:600; cursor:pointer;
  margin-bottom:.15rem; transition:background .15s ease;
}
.sd-nav a:hover, .sd-nav button.sd-navlink:hover{background:rgba(255,255,255,.1); color:#fff;}
.sd-nav a.active, .sd-nav button.sd-navlink.active{background:rgba(255,255,255,.18); color:#fff;}
.sd-nav i{width:18px; text-align:center; font-size:1rem;}
.sd-navbadge{margin-left:auto; background:var(--coral); color:#fff; font-size:.68rem; font-weight:800; border-radius:999px; padding:.05rem .45rem;}
.sd-presence{padding:.9rem 1rem; border-top:1px solid rgba(255,255,255,.15);}
.sd-presence-row{display:flex; align-items:center; gap:.5rem; font-size:.78rem; font-weight:700;}
.sd-presence select{background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.3); border-radius:8px; padding:.3rem .45rem; font-size:.76rem; font-weight:700;}
.sd-presence select option{color:#111;}
.sd-dot{width:9px; height:9px; border-radius:50%; background:var(--ok); flex-shrink:0;}
.sd-dot.away{background:var(--warn);} .sd-dot.offline{background:#9aa;}

/* ============================== SHELL ============================== */
.sd-shell{flex:1; display:flex; flex-direction:column; min-width:0; height:100vh;}
.sd-topbar{
  flex-shrink:0; background:#fff; border-bottom:1px solid var(--line); padding:.85rem 1.4rem;
  display:flex; align-items:center; gap:1rem; justify-content:space-between;
}
.sd-title{font-size:1.05rem; font-weight:800; color:var(--teal-deep);}
.sd-search{
  flex:1; max-width:420px; display:flex; align-items:center; gap:.5rem; background:var(--mist);
  border-radius:10px; padding:.5rem .8rem; color:var(--ink-soft); font-size:.85rem;
}
.sd-search input{border:none; background:none; outline:none; flex:1; font-size:.85rem; color:var(--ink);}
.sd-top-actions{display:flex; align-items:center; gap:.6rem;}
.sd-iconbtn{
  width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--ink-soft);
  display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative;
}
.sd-iconbtn:hover{background:var(--mist); color:var(--teal-deep);}
.sd-badge-dot{position:absolute; top:-3px; right:-3px; width:9px; height:9px; border-radius:50%; background:var(--coral); border:2px solid #fff;}

.sd-body{flex:1; overflow-y:auto; padding:1.4rem;}
.sd-view{display:none;}
.sd-view.active{display:block;}

/* ============================== CARDS / GRID ============================== */
.sd-stat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:.9rem; margin-bottom:1.4rem;}
.sd-stat{background:#fff; border:1px solid var(--line); border-radius:16px; padding:1rem 1.1rem;}
.sd-stat .k{font-size:.72rem; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; display:flex; align-items:center; gap:.4rem;}
.sd-stat .v{font-size:1.7rem; font-weight:800; color:var(--teal-deep); margin-top:.3rem;}
.sd-stat .v small{font-size:.8rem; font-weight:700; color:var(--ink-soft);}
.sd-card{background:#fff; border:1px solid var(--line); border-radius:16px; padding:1.1rem 1.2rem; margin-bottom:1.1rem;}
.sd-card h3{margin:0 0 .8rem; font-size:.95rem; font-weight:800; color:var(--teal-deep); display:flex; align-items:center; gap:.5rem; justify-content:space-between;}

table.sd-table{width:100%; border-collapse:collapse; font-size:.83rem;}
table.sd-table th{text-align:left; font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); padding:.5rem .6rem; border-bottom:1px solid var(--line);}
table.sd-table td{padding:.65rem .6rem; border-bottom:1px solid var(--line); vertical-align:middle;}
table.sd-table tr:last-child td{border-bottom:none;}
table.sd-table tr.clickable{cursor:pointer;}
table.sd-table tr.clickable:hover{background:var(--mist);}
.sd-empty{padding:1.6rem; text-align:center; color:var(--ink-soft); font-size:.85rem;}
.sd-loading{padding:1.6rem; text-align:center; color:var(--ink-soft); font-size:.85rem;}

.sd-pill{display:inline-flex; align-items:center; gap:.3rem; font-size:.7rem; font-weight:700; border-radius:999px; padding:.2rem .6rem;}
.sd-pill.open{background:#e5f3f0; color:var(--teal-deep);}
.sd-pill.in_progress{background:#fdf1e0; color:#8a6413;}
.sd-pill.closed{background:#eee; color:#666;}
.sd-pill.online{background:#e6f9ee; color:#188a4c;}
.sd-pill.away{background:#fdf1e0; color:#8a6413;}
.sd-pill.offline{background:#eee; color:#777;}
.sd-pill.ai{background:var(--mist); color:var(--teal-deep);}
.sd-pill.human{background:#fde8e2; color:var(--coral-deep);}
.sd-pill.priority_urgent{background:#fde3de; color:var(--danger);}

.sd-btn{border:none; border-radius:10px; background:var(--teal); color:#fff; font-weight:700; font-size:.82rem; padding:.5rem .9rem; cursor:pointer; display:inline-flex; align-items:center; gap:.4rem;}
.sd-btn:hover{background:var(--teal-deep);}
.sd-btn.secondary{background:var(--mist); color:var(--teal-deep);}
.sd-btn.secondary:hover{background:#dff2ef;}
.sd-btn.danger{background:#fde3de; color:var(--danger);}
.sd-btn.danger:hover{background:#fbd2ca;}
.sd-btn:disabled{opacity:.55; cursor:default;}
.sd-input, .sd-select, textarea.sd-input{
  width:100%; border:1.5px solid var(--line); border-radius:10px; padding:.55rem .7rem; font-size:.85rem;
  font-family:inherit; color:var(--ink); background:#fff;
}
.sd-input:focus, .sd-select:focus{outline:none; border-color:var(--teal);}
.sd-field{margin-bottom:.8rem;}
.sd-field label{display:block; font-size:.74rem; font-weight:700; color:var(--ink-soft); margin-bottom:.3rem;}

.sd-chiprow{display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:1rem;}
.sd-chip{border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:.4rem .85rem; font-size:.78rem; font-weight:700; color:var(--ink-soft); cursor:pointer;}
.sd-chip.active{background:var(--teal); border-color:var(--teal); color:#fff;}

/* Inbox split layout */
.sd-inbox{display:grid; grid-template-columns:340px 1fr; gap:1rem; height:calc(100vh - 190px);}
.sd-inbox-list{background:#fff; border:1px solid var(--line); border-radius:16px; overflow-y:auto;}
.sd-ticket-row{padding:.85rem 1rem; border-bottom:1px solid var(--line); cursor:pointer;}
.sd-ticket-row:hover{background:var(--mist);}
.sd-ticket-row.active{background:var(--mist); border-left:3px solid var(--teal);}
.sd-ticket-row .top{display:flex; justify-content:space-between; gap:.4rem; align-items:center; margin-bottom:.25rem;}
.sd-ticket-row .subj{font-weight:700; font-size:.85rem; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sd-ticket-row .prev{font-size:.78rem; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.sd-ticket-row .time{font-size:.68rem; color:var(--ink-soft); flex-shrink:0;}

.sd-thread-panel{background:#fff; border:1px solid var(--line); border-radius:16px; display:flex; flex-direction:column; min-height:0;}
.sd-thread-head{padding:.9rem 1.1rem; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:.6rem; flex-wrap:wrap;}
.sd-thread-messages{flex:1; overflow-y:auto; padding:1rem 1.1rem; display:flex; flex-direction:column; gap:.6rem;}
.sd-msg{max-width:72%; padding:.6rem .85rem; border-radius:14px; font-size:.86rem; line-height:1.45;}
.sd-msg.user{align-self:flex-start; background:var(--mist); color:var(--ink); border-bottom-left-radius:4px;}
.sd-msg.admin{align-self:flex-end; background:var(--teal); color:#fff; border-bottom-right-radius:4px;}
.sd-msg .meta{font-size:.65rem; opacity:.75; margin-top:.25rem;}
.sd-thread-compose{border-top:1px solid var(--line); padding:.8rem 1.1rem; display:flex; gap:.6rem; align-items:flex-end;}
.sd-thread-compose textarea{flex:1; resize:none; min-height:42px; max-height:120px;}
.sd-thread-side-actions{display:flex; gap:.4rem; flex-wrap:wrap;}

@media (max-width:900px){
  .sd-sidebar{position:fixed; z-index:40; transform:translateX(-100%); transition:transform .2s ease;}
  .sd-sidebar.open{transform:translateX(0);}
  .sd-inbox{grid-template-columns:1fr; height:auto;}
  .sd-inbox-list{max-height:280px;}
  .sd-thread-panel{height:60vh;}
}
.sd-mobile-toggle{display:none;}
@media (max-width:900px){ .sd-mobile-toggle{display:flex;} }
</style>
</head>
<body>

<!-- ============================== SIDEBAR ============================== -->
<aside class="sd-sidebar" id="sdSidebar">
  <div class="sd-brand"><span class="ic"><i class="bi bi-headset"></i></span> SoundsCare Support</div>
  <nav class="sd-nav" id="sdNav">
    <div class="sd-nav-label">Monitor</div>
    <button class="sd-navlink active" data-view="overview"><i class="bi bi-grid-1x2"></i> Overview</button>
    <button class="sd-navlink" data-view="visitors"><i class="bi bi-broadcast"></i> Live Visitors <span class="sd-navbadge" id="navLiveCount">0</span></button>

    <div class="sd-nav-label">Conversations</div>
    <button class="sd-navlink" data-view="inbox" data-filter="all"><i class="bi bi-inboxes"></i> Inbox</button>
    <button class="sd-navlink" data-view="inbox" data-filter="mine"><i class="bi bi-person-check"></i> My Conversations</button>
    <button class="sd-navlink" data-view="inbox" data-filter="unassigned"><i class="bi bi-question-circle"></i> Unassigned <span class="sd-navbadge" id="navUnassignedCount">0</span></button>
    <button class="sd-navlink" data-view="inbox" data-filter="waiting_human"><i class="bi bi-person-raised-hand"></i> Waiting for Human</button>
    <button class="sd-navlink" data-view="inbox" data-filter="ai"><i class="bi bi-stars"></i> AI Conversations</button>
    <button class="sd-navlink" data-view="inbox" data-filter="closed"><i class="bi bi-check2-circle"></i> Closed</button>

    <div class="sd-nav-label">Manage</div>
    <button class="sd-navlink" data-view="agents"><i class="bi bi-people"></i> Agents</button>
    <button class="sd-navlink" data-view="departments"><i class="bi bi-diagram-3"></i> Departments</button>
    <button class="sd-navlink" data-view="kb"><i class="bi bi-journal-text"></i> Knowledge Base</button>

    <div class="sd-nav-label">More</div>
    <a href="support-insights.html"><i class="bi bi-bar-chart-line"></i> Insights</a>
    <a href="support-settings.html"><i class="bi bi-gear"></i> Settings</a>
  </nav>
  <div class="sd-presence">
    <div class="sd-presence-row">
      <span class="sd-dot online" id="sdMyDot"></span>
      <span id="sdMyName">Loading…</span>
    </div>
    <select id="sdPresenceSelect" style="margin-top:.5rem; width:100%;">
      <option value="online">Online</option>
      <option value="away">Away</option>
      <option value="offline">Offline</option>
    </select>
  </div>
</aside>

<!-- ============================== SHELL ============================== -->
<div class="sd-shell">
  <header class="sd-topbar">
    <div style="display:flex; align-items:center; gap:.7rem;">
      <button class="sd-iconbtn sd-mobile-toggle" id="sdMobileToggle"><i class="bi bi-list"></i></button>
      <div class="sd-title" id="sdViewTitle">Overview</div>
    </div>
    <div class="sd-search"><i class="bi bi-search"></i><input id="sdSearchInput" placeholder="Search visitors, conversations, tickets, agents…"></div>
    <div class="sd-top-actions">
      <button class="sd-iconbtn" id="sdNotifBtn" title="Notifications"><i class="bi bi-bell"></i><span class="sd-badge-dot" id="sdNotifDot" style="display:none;"></span></button>
      <button class="sd-btn secondary" id="sdRefreshBtn"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
    </div>
  </header>

  <main class="sd-body">

    <!-- ---------------- OVERVIEW ---------------- -->
    <section class="sd-view active" id="viewOverview">
      <div class="sd-stat-grid" id="ovStats"></div>
      <div class="sd-card">
        <h3>Recent activity <button class="sd-btn secondary" id="ovRefreshActivity"><i class="bi bi-arrow-clockwise"></i></button></h3>
        <div id="ovActivity" class="sd-loading">Loading…</div>
      </div>
    </section>

    <!-- ---------------- LIVE VISITORS ---------------- -->
    <section class="sd-view" id="viewVisitors">
      <div class="sd-card">
        <h3>Live &amp; recent visitors <span style="font-weight:600; font-size:.75rem; color:var(--ink-soft);">auto-refreshes every 20s</span></h3>
        <div id="visitorsTableWrap" class="sd-loading">Loading…</div>
      </div>
    </section>

    <!-- ---------------- INBOX ---------------- -->
    <section class="sd-view" id="viewInbox">
      <div class="sd-chiprow" id="inboxChips">
        <button class="sd-chip active" data-f="all">All</button>
        <button class="sd-chip" data-f="unassigned">Unassigned</button>
        <button class="sd-chip" data-f="mine">Assigned to me</button>
        <button class="sd-chip" data-f="waiting_human">Waiting for human</button>
        <button class="sd-chip" data-f="ai">AI handled</button>
        <button class="sd-chip" data-f="open">Open</button>
        <button class="sd-chip" data-f="in_progress">Pending</button>
        <button class="sd-chip" data-f="closed">Closed</button>
        <button class="sd-chip" data-f="priority">Priority</button>
      </div>
      <div class="sd-inbox">
        <div class="sd-inbox-list" id="inboxList"><div class="sd-loading">Loading…</div></div>
        <div class="sd-thread-panel" id="threadPanel">
          <div class="sd-empty" style="margin:auto;"><i class="bi bi-chat-square-dots" style="font-size:1.8rem; display:block; margin-bottom:.5rem;"></i>Select a conversation</div>
        </div>
      </div>
    </section>

    <!-- ---------------- AGENTS ---------------- -->
    <section class="sd-view" id="viewAgents">
      <div class="sd-card">
        <h3>Support team <button class="sd-btn" id="agentInviteBtn"><i class="bi bi-person-plus"></i> Invite agent</button></h3>
        <div id="agentsTableWrap" class="sd-loading">Loading…</div>
      </div>
    </section>

    <!-- ---------------- DEPARTMENTS ---------------- -->
    <section class="sd-view" id="viewDepartments">
      <div class="sd-card">
        <h3>Departments <button class="sd-btn" id="deptAddBtn"><i class="bi bi-plus-lg"></i> Add department</button></h3>
        <div id="deptTableWrap" class="sd-loading">Loading…</div>
      </div>
    </section>

    <!-- ---------------- KNOWLEDGE BASE ---------------- -->
    <section class="sd-view" id="viewKb">
      <div class="sd-chiprow">
        <button class="sd-chip active" data-kb="articles">Articles</button>
        <button class="sd-chip" data-kb="faq">FAQ</button>
      </div>
      <div class="sd-card">
        <h3 id="kbTitle">Knowledge base articles <button class="sd-btn" id="kbAddBtn"><i class="bi bi-plus-lg"></i> New article</button></h3>
        <div id="kbTableWrap" class="sd-loading">Loading…</div>
      </div>
    </section>

  </main>
</div>

<!-- ============================== MODAL (generic) ============================== -->
<div id="sdModalBackdrop" style="display:none; position:fixed; inset:0; background:rgba(10,20,18,.45); z-index:60; align-items:center; justify-content:center; padding:1rem;">
  <div id="sdModalCard" style="background:#fff; border-radius:18px; padding:1.4rem; width:100%; max-width:440px; max-height:88vh; overflow-y:auto;"></div>
</div>

<!-- Toasts -->
<div id="sdToasts" style="position:fixed; bottom:1rem; right:1rem; z-index:70; display:flex; flex-direction:column; gap:.5rem;"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
  'use strict';

  // ---- Same Supabase project/credentials as support.html (anon key; RLS
  // restricts everything below to authenticated, active support_agents rows).
  var sb = supabase.createClient(
    'https://phoahudvrcelfrykoeuo.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBob2FodWR2cmNlbGZyeWtvZXVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDY0MTMsImV4cCI6MjA5NDQyMjQxM30.xBKbHIttK__d_jQFLavYyJQilUGUFISiWrh8-hgIA9Y'
  );

  var me = { authUser:null, agent:null };
  var state = {
    view:'overview', inboxFilter:'all', kbTab:'articles',
    tickets:[], agents:[], departments:[], currentTicket:null, msgChannel:null, ticketChannel:null,
    renderedMsgIds:{}
  };

  // ------------------------------------------------------------------ utils
  function $(id){ return document.getElementById(id); }
  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function timeAgo(ts){
    if(!ts) return '';
    var d = (Date.now() - new Date(ts).getTime())/1000;
    if(d<60) return 'just now';
    if(d<3600) return Math.floor(d/60)+'m ago';
    if(d<86400) return Math.floor(d/3600)+'h ago';
    return Math.floor(d/86400)+'d ago';
  }
  function toast(msg, kind){
    var t = document.createElement('div');
    t.style.cssText = 'background:#fff;border:1px solid var(--line);border-left:4px solid '+(kind==='error'?'var(--danger)':'var(--teal)')+';border-radius:10px;padding:.7rem 1rem;font-size:.83rem;box-shadow:0 12px 30px -14px rgba(0,0,0,.25);max-width:320px;';
    t.textContent = msg;
    $('sdToasts').appendChild(t);
    setTimeout(function(){ t.remove(); }, 4200);
  }
  function logErr(scope, err){ console.error('[Support]', scope, err); }
  function openModal(html){ $('sdModalCard').innerHTML = html; $('sdModalBackdrop').style.display='flex'; }
  function closeModal(){ $('sdModalBackdrop').style.display='none'; $('sdModalCard').innerHTML=''; }
  $('sdModalBackdrop').addEventListener('click', function(e){ if(e.target===$('sdModalBackdrop')) closeModal(); });

  // ------------------------------------------------------------------ auth / agent bootstrap
  async function init(){
    try{
      var { data:{ session } } = await sb.auth.getSession();
      if(!session){
        document.body.innerHTML = '<div style="margin:auto;padding:2rem;text-align:center;font-family:sans-serif;">'+
          '<h2>Please sign in</h2><p>You need an agent account to view this dashboard.</p>'+
          '<a href="/login.html" class="sd-btn" style="display:inline-block;margin-top:.5rem;">Go to login</a></div>';
        return;
      }
      me.authUser = session.user;
      var { data: agentRow, error } = await sb.from('support_agents').select('*').eq('user_id', me.authUser.id).maybeSingle();
      if(error) throw error;
      if(!agentRow || !agentRow.is_active){
        document.body.innerHTML = '<div style="margin:auto;padding:2rem;text-align:center;font-family:sans-serif;">'+
          '<h2>Not authorized</h2><p>Your account is not an active support agent. Ask an admin to invite you.</p></div>';
        return;
      }
      me.agent = agentRow;
      $('sdMyName').textContent = agentRow.display_name + ' · ' + agentRow.role;
      $('sdPresenceSelect').value = agentRow.presence || 'online';
      setMyDot(agentRow.presence || 'online');
      await sb.rpc('support_agent_heartbeat', { p_presence: agentRow.presence || 'online' }).catch(function(e){ logErr('heartbeat', e); });

      wireNav();
      wireTopbar();
      wireInbox();
      wireAgents();
      wireDepartments();
      wireKb();

      await loadOverview();
      startPolling();
    }catch(err){
      logErr('init', err);
      toast('Could not load the dashboard. Please refresh.', 'error');
    }
  }

  function setMyDot(p){
    var d = $('sdMyDot'); d.className = 'sd-dot ' + (p==='online'?'online':p==='away'?'away':'offline');
  }
  $('sdPresenceSelect').addEventListener('change', async function(){
    var v = this.value;
    setMyDot(v);
    try{ await sb.rpc('support_agent_heartbeat', { p_presence:v }); }
    catch(err){ logErr('presence update', err); toast('Could not update presence', 'error'); }
  });

  async function globalSearch(q){
    if(!q) return;
    try{
      var [tix, agn, vis] = await Promise.all([
        sb.from('support_tickets').select('id, subject, category, status').ilike('subject', '%'+q+'%').limit(5),
        sb.from('support_agents').select('id, display_name, email').or('display_name.ilike.%'+q+'%,email.ilike.%'+q+'%').limit(5),
        sb.from('support_visitors').select('id, name, email').or('name.ilike.%'+q+'%,email.ilike.%'+q+'%').limit(5)
      ]);
      var lines = [];
      (tix.data||[]).forEach(function(t){ lines.push('Ticket: '+t.subject); });
      (agn.data||[]).forEach(function(a){ lines.push('Agent: '+a.display_name); });
      (vis.data||[]).forEach(function(v){ lines.push('Visitor: '+(v.name||v.email||'Unnamed')); });
      openModal('<h3 style="margin-top:0;">Search results for "'+esc(q)+'"</h3>'+
        (lines.length ? '<ul style="padding-left:1.1rem;">'+lines.map(function(l){return '<li>'+esc(l)+'</li>';}).join('')+'</ul>' : '<div class="sd-empty">No matches.</div>')+
        '<button class="sd-btn secondary" onclick="document.getElementById(\'sdModalBackdrop\').style.display=\'none\'">Close</button>');
    }catch(err){ logErr('global search', err); toast('Search failed', 'error'); }
  }

  // ------------------------------------------------------------------ INBOX (sections 11, 12, 47, 48)
  function wireInbox(){
    document.querySelectorAll('.sd-chip[data-f]').forEach(function(chip){
      chip.addEventListener('click', function(){
        document.querySelectorAll('.sd-chip[data-f]').forEach(function(c){ c.classList.remove('active'); });

  async function loadInbox(){
    var list = $('inboxList');
    list.innerHTML = '<div class="sd-loading">Loading…</div>';
    try{
      var q = sb.from('support_tickets')
        .select('id, subject, category, priority, status, assigned_admin_id, ai_handled, human_requested_at, created_at, updated_at, tags')
        .order('updated_at', { ascending:false }).limit(80);

      switch(state.inboxFilter){
        case 'unassigned': q = q.is('assigned_admin_id', null).neq('status','closed'); break;
        case 'mine': q = q.eq('assigned_admin_id', me.authUser.id); break;
        case 'waiting_human': q = q.not('human_requested_at','is', null).is('assigned_admin_id', null); break;
        case 'ai': q = q.eq('ai_handled', true); break;
        case 'open': q = q.eq('status','open'); break;
        case 'in_progress': q = q.eq('status','in_progress'); break;
        case 'closed': q = q.eq('status','closed'); break;
        case 'priority': q = q.eq('priority','urgent'); break;
        default: break; // all
      }
      var { data, error } = await q;
      if(error) throw error;
      state.tickets = data || [];
      if(!state.tickets.length){ list.innerHTML = '<div class="sd-empty">No conversations in this view.</div>'; return; }
      list.innerHTML = state.tickets.map(function(t){
        return '<div class="sd-ticket-row" data-id="'+t.id+'">'+
          '<div class="top"><span class="subj">'+esc(t.subject||'(no subject)')+'</span><span class="time">'+timeAgo(t.updated_at)+'</span></div>'+
          '<div class="prev">'+esc(t.category||'general')+' · <span class="sd-pill '+esc(t.status)+'">'+esc(t.status)+'</span> '+
          (t.human_requested_at && !t.assigned_admin_id ? '<span class="sd-pill human">needs human</span>' : (t.ai_handled ? '<span class="sd-pill ai">AI</span>' : '')) +'</div>'+
        '</div>';
      }).join('');
      list.querySelectorAll('.sd-ticket-row').forEach(function(row){
        row.addEventListener('click', function(){ openTicket(row.dataset.id); });
      });
      if(state.currentTicket) {
        var stillThere = state.tickets.some(function(t){return t.id===state.currentTicket.id;});
        list.querySelectorAll('.sd-ticket-row').forEach(function(r){ r.classList.toggle('active', r.dataset.id===state.currentTicket.id); });
      }
    }catch(err){
      logErr('loadInbox', err);
      list.innerHTML = '<div class="sd-empty">Could not load conversations.</div>';
    }
  }

  async function openTicket(id){
    var panel = $('threadPanel');
    panel.innerHTML = '<div class="sd-loading" style="margin:auto;">Loading conversation…</div>';
    document.querySelectorAll('.sd-ticket-row').forEach(function(r){ r.classList.toggle('active', r.dataset.id===id); });
    try{
      var { data: ticket, error } = await sb.from('support_tickets')
        .select('id, subject, category, priority, status, assigned_admin_id, ai_handled, human_requested_at, tags, created_at, users(full_name, email)')
        .eq('id', id).single();
      if(error) throw error;
      state.currentTicket = ticket;
      state.renderedMsgIds = {};

      var { data: msgs, error: mErr } = await sb.from('support_ticket_messages')
        .select('id, sender_id, sender_type, message, created_at').eq('ticket_id', id).order('created_at', { ascending:true });
      if(mErr) throw mErr;

      renderThreadShell(ticket);
      (msgs||[]).forEach(renderMessage);
      scrollThreadToBottom();
      subscribeThread(id);
    }catch(err){
      logErr('openTicket', err);
      panel.innerHTML = '<div class="sd-empty" style="margin:auto;">Could not load this conversation.</div>';
    }
  }

  function renderThreadShell(t){
    var panel = $('threadPanel');
    var assignedToMe = t.assigned_admin_id === me.authUser.id;
    panel.innerHTML =
      '<div class="sd-thread-head">'+
        '<div><strong>'+esc(t.subject||'(no subject)')+'</strong><div style="font-size:.76rem;color:var(--ink-soft);">'+
          esc((t.users&&t.users.full_name)||'Guest')+' · '+esc(t.category||'general')+' · <span class="sd-pill '+esc(t.status)+'">'+esc(t.status)+'</span></div></div>'+
        '<div class="sd-thread-side-actions">'+
          (t.assigned_admin_id ? (assignedToMe?'<span class="sd-pill ai">Assigned to you</span>':'<span class="sd-pill human">Assigned</span>') : '<button class="sd-btn" id="claimBtn"><i class="bi bi-hand-index-thumb"></i> Claim</button>')+
          '<select class="sd-select" id="statusSelect" style="width:auto;">'+
            ['open','in_progress','closed'].map(function(s){return '<option value="'+s+'" '+(t.status===s?'selected':'')+'>'+s+'</option>';}).join('')+
          '</select>'+
        '</div>'+
      '</div>'+
      '<div class="sd-thread-messages" id="threadMessages"></div>'+
      '<div class="sd-thread-compose">'+
        '<textarea class="sd-input" id="replyBox" placeholder="Type a reply…"></textarea>'+
        '<button class="sd-btn" id="replySendBtn"><i class="bi bi-send"></i></button>'+
      '</div>';

    var claimBtn = $('claimBtn');
    if(claimBtn) claimBtn.addEventListener('click', async function(){
      claimBtn.disabled = true;
      try{
        var { error } = await sb.rpc('support_assign_ticket', { p_ticket_id:t.id });
        if(error) throw error;
        toast('Conversation claimed — AI auto-replies stopped.');
        openTicket(t.id); loadInbox();
      }catch(err){ logErr('claim ticket', err); toast('Could not claim conversation', 'error'); claimBtn.disabled=false; }
    });

    $('statusSelect').addEventListener('change', async function(){
      var val = this.value;
      try{
        var patch = { status: val };
        if(val==='closed') patch.closed_at = new Date().toISOString();
        var { error } = await sb.from('support_tickets').update(patch).eq('id', t.id);
        if(error) throw error;
        toast('Status updated to '+val);
        loadInbox();
      }catch(err){ logErr('update status', err); toast('Could not update status', 'error'); }
    });

    $('replySendBtn').addEventListener('click', sendReply);
    $('replyBox').addEventListener('keydown', function(e){
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendReply(); }
    });
  }

  async function sendReply(){
    var box = $('replyBox');
    var text = (box.value||'').trim();
    if(!text || !state.currentTicket) return;
    box.value=''; box.disabled = true;
    try{
      var { data: row, error } = await sb.from('support_ticket_messages').insert({
        ticket_id: state.currentTicket.id, sender_id: me.authUser.id, sender_type:'admin', message:text
      }).select('id, sender_id, sender_type, message, created_at').single();
      if(error) throw error;
      renderMessage(row); scrollThreadToBottom();
      await sb.from('support_tickets').update({ status:'in_progress' }).eq('id', state.currentTicket.id);
      loadInbox();
    }catch(err){
      logErr('sendReply', err);
      toast('Message failed to send', 'error');
      box.value = text;
    }finally{ box.disabled = false; box.focus(); }
  }

  function renderMessage(row){
    if(!row || state.renderedMsgIds[row.id]) return;
    state.renderedMsgIds[row.id] = true;
    var mine = row.sender_type === 'admin';
    var el = document.createElement('div');
    el.className = 'sd-msg ' + (mine?'admin':'user');
    el.innerHTML = esc(row.message) + '<div class="meta">'+new Date(row.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</div>';
    var box = $('threadMessages'); if(box) box.appendChild(el);
  }
  function scrollThreadToBottom(){ var box = $('threadMessages'); if(box) box.scrollTop = box.scrollHeight; }

  function subscribeThread(ticketId){
    if(state.msgChannel){ sb.removeChannel(state.msgChannel); state.msgChannel = null; }
    state.msgChannel = sb.channel('sd-ticket-'+ticketId)
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'support_ticket_messages', filter:'ticket_id=eq.'+ticketId }, function(payload){
        if(state.currentTicket && state.currentTicket.id === ticketId){ renderMessage(payload.new); scrollThreadToBottom(); }
      })
      .subscribe();
  }

            if(error) throw error;
            toast('Department updated'); loadDepartments();
          }catch(err){ logErr('toggle department', err); toast('Could not update department', 'error'); btn.disabled=false; }
        });
      });
    }catch(err){
      logErr('loadDepartments', err);
      wrap.innerHTML = '<div class="sd-empty">Could not load departments.</div>';
    }
  }

  // ------------------------------------------------------------------ KNOWLEDGE BASE (section 22)
  function wireKb(){
    document.querySelectorAll('.sd-chip[data-kb]').forEach(function(chip){
      chip.addEventListener('click', function(){
        document.querySelectorAll('.sd-chip[data-kb]').forEach(function(c){ c.classList.remove('active'); });
        chip.classList.add('active');
        state.kbTab = chip.dataset.kb;
        $('kbTitle').innerHTML = (state.kbTab==='articles' ? 'Knowledge base articles' : 'FAQ items') +
          ' <button class="sd-btn" id="kbAddBtn"><i class="bi bi-plus-lg"></i> New '+(state.kbTab==='articles'?'article':'FAQ')+'</button>';
        wireKbAdd();
        loadKb();
      });
    });
    wireKbAdd();
  }
  function wireKbAdd(){
    var btn = $('kbAddBtn'); if(!btn) return;
    btn.addEventListener('click', function(){
      if(state.kbTab==='articles'){
        openModal(
          '<h3 style="margin-top:0;">New article</h3>'+
          '<div class="sd-field"><label>Title</label><input class="sd-input" id="kbTitleInput"></div>'+
          '<div class="sd-field"><label>Summary</label><textarea class="sd-input" id="kbSummaryInput" rows="3"></textarea></div>'+
          '<div style="display:flex; gap:.5rem; justify-content:flex-end;">'+
            '<button class="sd-btn secondary" onclick="document.getElementById(\'sdModalBackdrop\').style.display=\'none\'">Cancel</button>'+
            '<button class="sd-btn" id="kbSaveBtn"><i class="bi bi-check-lg"></i> Save draft</button></div>'
        );
        $('kbSaveBtn').addEventListener('click', async function(){
          var title = $('kbTitleInput').value.trim(), summary = $('kbSummaryInput').value.trim();
          if(!title){ toast('Title is required', 'error'); return; }
          var slug = title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
          this.disabled = true;
          try{
            var { error } = await sb.from('kb_articles').insert({ title:title, slug:slug, summary:summary, is_active:false });
            if(error) throw error;
            toast('Draft saved'); closeModal(); loadKb();
          }catch(err){ logErr('add kb article', err); toast('Could not save article', 'error'); this.disabled=false; }
        });
      } else {
        openModal(
          '<h3 style="margin-top:0;">New FAQ item</h3>'+
          '<div class="sd-field"><label>Question</label><input class="sd-input" id="faqQ"></div>'+
          '<div class="sd-field"><label>Answer</label><textarea class="sd-input" id="faqA" rows="3"></textarea></div>'+
          '<div style="display:flex; gap:.5rem; justify-content:flex-end;">'+
            '<button class="sd-btn secondary" onclick="document.getElementById(\'sdModalBackdrop\').style.display=\'none\'">Cancel</button>'+
            '<button class="sd-btn" id="faqSaveBtn"><i class="bi bi-check-lg"></i> Save</button></div>'
        );
        $('faqSaveBtn').addEventListener('click', async function(){
          var q = $('faqQ').value.trim(), a = $('faqA').value.trim();
          if(!q || !a){ toast('Question and answer are required', 'error'); return; }
          this.disabled = true;
          try{
            var { error } = await sb.from('faq_items').insert({ question:q, answer:a, is_active:true });
            if(error) throw error;
            toast('FAQ added'); closeModal(); loadKb();
          }catch(err){ logErr('add faq', err); toast('Could not save FAQ', 'error'); this.disabled=false; }
        });
      }
    });
  }

  async function loadKb(){
    var wrap = $('kbTableWrap');
    wrap.innerHTML = '<div class="sd-loading">Loading…</div>';
    try{
      if(state.kbTab==='articles'){
        var { data, error } = await sb.from('kb_articles').select('id, title, slug, is_active, created_at').order('created_at', { ascending:false });
        if(error) throw error;
        if(!data || !data.length){ wrap.innerHTML = '<div class="sd-empty">No articles yet.</div>'; return; }
        wrap.innerHTML = '<table class="sd-table"><thead><tr><th>Title</th><th>Status</th><th></th></tr></thead><tbody>'+
          data.map(function(a){
            return '<tr><td><strong>'+esc(a.title)+'</strong><div style="font-size:.72rem;color:var(--ink-soft);">/'+esc(a.slug)+'</div></td>'+
              '<td>'+(a.is_active?'<span class="sd-pill online">Published</span>':'<span class="sd-pill offline">Draft</span>')+'</td>'+
              '<td><button class="sd-btn secondary sd-toggle-kb" data-id="'+a.id+'" data-active="'+a.is_active+'">'+(a.is_active?'Unpublish':'Publish')+'</button></td></tr>';
          }).join('')+'</tbody></table>';
        wrap.querySelectorAll('.sd-toggle-kb').forEach(function(btn){
          btn.addEventListener('click', async function(){
            var id=btn.dataset.id, nowActive = btn.dataset.active==='true';
            btn.disabled = true;
            try{ var { error } = await sb.from('kb_articles').update({ is_active: !nowActive }).eq('id', id); if(error) throw error; toast('Article updated'); loadKb(); }
            catch(err){ logErr('toggle kb article', err); toast('Could not update article', 'error'); btn.disabled=false; }
          });
        });
      } else {
        var r2 = await sb.from('faq_items').select('id, question, is_active, created_at').order('created_at', { ascending:false });
        if(r2.error) throw r2.error;
        if(!r2.data || !r2.data.length){ wrap.innerHTML = '<div class="sd-empty">No FAQ items yet.</div>'; return; }
        wrap.innerHTML = '<table class="sd-table"><thead><tr><th>Question</th><th>Status</th><th></th></tr></thead><tbody>'+
          r2.data.map(function(f){
            return '<tr><td>'+esc(f.question)+'</td>'+
              '<td>'+(f.is_active?'<span class="sd-pill online">Active</span>':'<span class="sd-pill offline">Hidden</span>')+'</td>'+
              '<td><button class="sd-btn secondary sd-toggle-faq" data-id="'+f.id+'" data-active="'+f.is_active+'">'+(f.is_active?'Hide':'Show')+'</button></td></tr>';
          }).join('')+'</tbody></table>';
        wrap.querySelectorAll('.sd-toggle-faq').forEach(function(btn){
          btn.addEventListener('click', async function(){
            var id=btn.dataset.id, nowActive = btn.dataset.active==='true';
            btn.disabled = true;
            try{ var { error } = await sb.from('faq_items').update({ is_active: !nowActive }).eq('id', id); if(error) throw error; toast('FAQ updated'); loadKb(); }
            catch(err){ logErr('toggle faq', err); toast('Could not update FAQ', 'error'); btn.disabled=false; }
          });
        });
      }
    }catch(err){
      logErr('loadKb', err);
      wrap.innerHTML = '<div class="sd-empty">Could not load knowledge base.</div>';
    }
  }

  // ------------------------------------------------------------------ realtime new-conversation / assignment notifications (section 17/18)
  function startPolling(){
    if(state.ticketChannel) return;
    state.ticketChannel = sb.channel('sd-tickets-global')
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'support_tickets' }, function(){
        $('sdNotifDot').style.display = 'block';
        if(state.view==='inbox') loadInbox();
        if(state.view==='overview') loadOverview();
      })
      .on('postgres_changes', { event:'UPDATE', schema:'public', table:'support_tickets' }, function(){
        if(state.view==='inbox') loadInbox();
      })
      .subscribe();
    $('sdNotifBtn').addEventListener('click', function(){ $('sdNotifDot').style.display='none'; });
    // Lightweight periodic refresh for views without dedicated realtime feeds yet
    setInterval(function(){
      if(state.view==='visitors') loadVisitors();
      if(state.view==='overview') loadOverview();
    }, 20000);
  }

  init();
})();
</script>
</body>
</html>

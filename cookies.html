<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cookies — SoundsCare Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/sidebar.css"><link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/modal.css"><link rel="stylesheet" href="css/tables.css"><link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/forms.css"><link rel="stylesheet" href="css/responsive.css">
</head><body data-page="cookies">
<div id="maintenance-banner"><i class="bi bi-exclamation-triangle-fill"></i> Maintenance mode is ON.</div>
<div data-include="sidebar"></div>
<div class="main" id="main">
  <div data-include="topbar"></div>
  <div class="content">
    <div class="page-head"><div><h1>Cookies &amp; Local Data</h1><p>This admin panel does not show a cookie consent banner — manage session/local data here</p></div></div>
    <div class="section">
      <div class="section-header"><div class="section-title"><i class="bi bi-cookie"></i> Status</div><button class="btn btn-sm btn-secondary" onclick="renderCookieStatus()"><i class="bi bi-arrow-clockwise"></i> Refresh</button></div>
      <div class="section-body">
        <div id="cookie-status-list"></div>
        <div class="actions-cell" style="margin-top:1.25rem;flex-wrap:wrap;gap:8px">
          <button class="btn btn-sm btn-secondary" onclick="clearAllCookies()"><i class="bi bi-cookie"></i> Clear Cookies</button>
          <button class="btn btn-sm btn-secondary" onclick="clearLocalStorage()"><i class="bi bi-hdd"></i> Clear Local Storage</button>
          <button class="btn btn-sm btn-secondary" onclick="clearSessionStorage()"><i class="bi bi-hdd-stack"></i> Clear Session Storage</button>
          <button class="btn btn-sm btn-secondary" onclick="clearBrowserCache()"><i class="bi bi-trash"></i> Clear Cache</button>
          <button class="btn btn-sm btn-danger" onclick="manageRememberedSessions()"><i class="bi bi-box-arrow-right"></i> Forget Remembered Sessions</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div data-include="modal"></div><div data-include="toast"></div>
<script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/layout.js"></script>
<script src="js/auth.js"></script><script src="js/api.js"></script><script src="js/cookies.js"></script>
<script>(async function(){await initLayout();const admin=await requireAuth();if(!admin)return;renderCookieStatus();})();</script>
</body></html>

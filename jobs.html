<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jobs — SoundsCare</title>
<meta name="description" content="Browse available jobs on SoundsCare and apply directly on WhatsApp.">
<link rel="icon" href="sounds_logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --blue:#1a6cf0; --blue-d:#0b4fd0; --teal:#14b8a6; --teal-d:#0a948a;
    --bg:#f5f7fb; --surface:#fff; --surface-2:#f0f3f9; --line:#e2e7f0; --text:#101828; --muted:#5b6678;
    --ok:#0f9d6b; --bad:#d92d20; --warn:#b7791f;
    --blue-bg:#e4eefe; --teal-bg:#dcf5f1; --bad-bg:#fde8e6; --warn-bg:#fdf3dc;
    --wa:#25d366; --wa-d:#1ea952;
    --radius:16px; --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0c111b; --surface:#141b29; --surface-2:#1b2434; --line:#27324a; --text:#eef2fa; --muted:#9aa6bd;
      --blue-bg:#12254a; --teal-bg:#0d2f2c; --bad-bg:#3a1512; --warn-bg:#33270c; --shadow:none; }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}
  .bi{line-height:1;vertical-align:-.125em}

  /* top bar */
  .topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
  .topbar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:800;font-size:19px;letter-spacing:-.01em}
  .brand .logo{height:38px;width:38px;object-fit:contain;border-radius:10px;background:#fff;padding:2px;border:1px solid var(--line)}
  .brand b{color:var(--blue)}
  .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--muted);font-size:14px;font-weight:600;padding:8px 12px;border-radius:10px}
  .back:hover{background:var(--surface-2);color:var(--text)}

  /* hero */
  .hero{background:linear-gradient(135deg,var(--blue) 0%,#2a8ce8 55%,var(--teal) 100%);color:#fff;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-80px;top:-80px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.08)}
  .hero-in{max-width:1180px;margin:0 auto;padding:34px 16px 70px;position:relative;z-index:1}
  .hero h1{margin:0 0 6px;font-size:32px;font-weight:800;letter-spacing:-.02em}
  .hero p{margin:0;font-size:16px;opacity:.93;max-width:560px}
  .hero-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;backdrop-filter:blur(4px)}

  .wrap{max-width:1180px;margin:-48px auto 0;padding:0 16px 60px;position:relative;z-index:2}

  /* search */
  .searchbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
  .search-row{display:flex;gap:10px;flex-wrap:wrap}
  .field{position:relative;flex:1 1 260px}
  .field i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}
  .field input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:12px;background:var(--surface);outline:none;font-size:15px}
  .field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,108,240,.18)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
  .chip:hover{border-color:var(--blue);color:var(--blue)}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff}

  .result-bar{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 12px;color:var(--muted);font-size:14px;font-weight:600}

  /* cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
  .job{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;transition:transform .15s,border-color .15s}
  .job:hover{transform:translateY(-2px);border-color:var(--blue)}
  .job-top{display:flex;gap:12px;align-items:flex-start}
  .avatar{flex:0 0 46px;height:46px;border-radius:13px;background:var(--blue-bg);color:var(--blue);display:grid;place-items:center;font-size:21px}
  .job.feat .avatar{background:var(--warn-bg);color:var(--warn)}
  .job-title{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.3;cursor:pointer}
  .job-title:hover{color:var(--blue)}
  .job-emp{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;margin-top:2px}
  .job-emp .bi-patch-check-fill{color:var(--blue)}
  .badges{display:flex;flex-wrap:wrap;gap:6px}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
  .b-feat{background:var(--warn-bg);color:var(--warn)}
  .b-urg{background:var(--bad-bg);color:var(--bad)}
  .meta{display:flex;flex-wrap:wrap;gap:8px}
  .m{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:10px;padding:6px 11px;font-size:13px;font-weight:500}
  .m i{color:var(--blue)}
  .m.sal{background:var(--teal-bg)} .m.sal i{color:var(--teal-d)}
  .snip{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .stats{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);padding-top:12px;border-top:1px dashed var(--line)}
  .stats span{display:inline-flex;align-items:center;gap:6px}
  .stats .hot{color:var(--ok);font-weight:600}
  .actions{display:flex;gap:10px}
  .actions .btn{flex:1;justify-content:center}

  .btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;border:1px solid transparent;cursor:pointer;padding:11px 16px;font-size:14px;font-weight:600;transition:.15s;text-decoration:none}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:hover{background:var(--blue-d)}
  .btn-wa{background:var(--wa);color:#06361a}
  .btn-wa:hover{background:var(--wa-d)}
  .btn-ghost{background:var(--surface);border-color:var(--line);color:var(--text)}
  .btn-ghost:hover{background:var(--surface-2);border-color:var(--blue);color:var(--blue)}
  .more{display:flex;justify-content:center;margin-top:22px}

  /* states */
  .empty{grid-column:1/-1;text-align:center;padding:50px 20px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted)}
  .empty i{font-size:42px;color:var(--blue);display:block;margin-bottom:10px}
  .empty.err i{color:var(--bad)}
  .skel{height:250px;border-radius:var(--radius);background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border:1px solid var(--line)}
  @keyframes sh{to{background-position:-200% 0}}

  /* modal */
  .overlay{display:none;position:fixed;inset:0;z-index:1000;background:rgba(8,12,22,.62);align-items:center;justify-content:center;padding:14px}
  .modal{background:var(--surface);border-radius:20px;width:100%;max-width:700px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.4);overflow:hidden}
  .m-head{display:flex;gap:14px;align-items:flex-start;padding:20px 22px;border-bottom:1px solid var(--line)}
  .m-head h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.25}
  .m-head .job-emp{font-size:14px}
  .m-x{margin-left:auto;background:var(--surface-2);border:none;width:36px;height:36px;border-radius:50%;cursor:pointer;display:grid;place-items:center;font-size:18px;color:var(--muted);flex:0 0 36px}
  .m-x:hover{color:var(--text)}
  .m-body{padding:20px 22px;overflow-y:auto}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
  .kpi{background:var(--surface-2);border-radius:14px;padding:12px;text-align:center}
  .kpi i{font-size:18px;color:var(--blue)}
  .kpi b{display:block;font-size:22px;font-weight:800;margin-top:2px}
  .kpi small{color:var(--muted);font-weight:600;font-size:12px}
  .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
  .fact{display:flex;gap:10px;align-items:flex-start}
  .fact i{color:var(--blue);font-size:17px;margin-top:2px}
  .fact small{display:block;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .fact span{font-size:14px;font-weight:600}
  .sec{margin-top:16px}
  .sec h3{margin:0 0 6px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
  .sec h3 i{color:var(--blue)}
  .sec p{margin:0;color:var(--text);font-size:14.5px;line-height:1.65}
  .sec p.none{color:var(--muted);font-style:italic}
  .m-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface)}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:2000}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}


  /* apply flow */
  .btn-block{width:100%;justify-content:center}
  .btn-icon{flex:0 0 46px!important;padding-left:0;padding-right:0}
  .linkbtn{background:none;border:none;color:var(--blue);font-weight:600;font-size:13.5px;cursor:pointer;padding:4px 0;display:inline-flex;align-items:center;gap:6px}
  .linkbtn:hover{text-decoration:underline}
  .a-title{margin:10px 0 12px;font-size:18px;font-weight:800}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface-2);padding:5px;border-radius:14px;margin-bottom:14px}
  .seg button{border:none;background:transparent;border-radius:10px;padding:10px 6px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  .seg button i{font-size:17px}
  .seg button.on{background:var(--surface);color:var(--blue);box-shadow:0 1px 4px rgba(16,24,40,.12)}
  .hint{margin:0 0 12px;color:var(--muted);font-size:13.5px}
  .lab{display:block;font-size:12.5px;font-weight:700;margin:12px 0 5px}
  .inp{position:relative}
  .inp i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .inp input,#a_msg{width:100%;padding:11px 13px 11px 38px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:15px;outline:none}
  #a_msg{padding-left:13px;resize:vertical;min-height:84px}
  .inp input:focus,#a_msg:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,108,240,.18)}
  form[data-form] .btn-primary{margin-top:16px}
  .chk{display:flex;gap:10px;align-items:flex-start;margin:14px 0 0;font-size:13.5px;color:var(--muted);cursor:pointer}
  .chk input{margin-top:3px;width:17px;height:17px;accent-color:var(--blue)}
  .note{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--teal-bg);border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:6px}
  .note i{color:var(--teal-d);font-size:18px}
  .note .linkbtn{margin-left:auto}
  .amsg:empty{display:none}
  .amsg{margin:12px 0 0;padding:10px 14px;border-radius:12px;font-size:13.5px;font-weight:500;display:flex;gap:10px;align-items:flex-start}
  .amsg.err{background:var(--bad-bg);color:var(--bad)}
  .amsg.ok{background:var(--teal-bg);color:var(--teal-d)}
  .amsg.info{background:var(--blue-bg);color:var(--blue)}
  .or{display:flex;align-items:center;gap:12px;margin:18px 0 12px;color:var(--muted);font-size:12.5px;font-weight:600}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  .done{text-align:center;padding:14px 4px}
  .done .big{font-size:56px;color:var(--ok)}
  .done h3{margin:8px 0 6px;font-size:21px;font-weight:800}
  .done p{margin:0 auto 18px;color:var(--muted);max-width:420px}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}

  footer{max-width:1180px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:13px;text-align:center}

  @media (max-width:640px){
    .hero h1{font-size:25px}
    .hero-in{padding:26px 16px 64px}
    .grid{grid-template-columns:1fr}
    .back span{display:none}
    .m-foot{flex-direction:column-reverse}
    .m-foot .btn{justify-content:center}
    .kpi b{font-size:19px}
  }
</style>
</head>
<body>

<header class="topbar"><div class="topbar-in">
  <a class="brand" href="/"><img class="logo" data-logo src="sounds_logo.jpg" alt="SoundsCare logo"><span><b>Sounds</b>Care</span></a>
  <a class="back" href="/"><i class="bi bi-arrow-left"></i><span>Back to site</span></a>
</div></header>

<section class="hero"><div class="hero-in">
  <h1>Find your next job</h1>
  <p>Browse verified openings and apply in seconds directly on WhatsApp.</p>
  <div class="hero-stats">
    <span class="pill"><i class="bi bi-briefcase-fill"></i> <span id="sJobs">–</span> open jobs</span>
    <span class="pill"><i class="bi bi-people-fill"></i> <span id="sApps">–</span> applications received</span>
    <span class="pill"><i class="bi bi-whatsapp"></i> Apply on WhatsApp</span>
  </div>
</div></section>

<main class="wrap">
  <div class="searchbox">
    <div class="search-row">
      <div class="field"><i class="bi bi-search"></i><input id="q" type="search" placeholder="Search job title, role or location…" autocomplete="off"></div>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="result-bar"><span id="count">Loading jobs…</span></div>
  <div class="grid" id="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  <div class="more" id="more" style="display:none"><button class="btn btn-ghost" id="moreBtn"><i class="bi bi-arrow-down-circle"></i> Show more jobs</button></div>
</main>

<footer>© SoundsCare · Questions? Message us on WhatsApp.</footer>

<div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal">
    <div class="m-head">
      <div class="avatar" id="mAvatar"><i class="bi bi-briefcase-fill"></i></div>
      <div><h2 id="mTitle">Job</h2><div class="job-emp" id="mEmp"></div></div>
      <button class="m-x" id="mClose" aria-label="Close"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="m-body" id="mBody"></div>
    <div class="m-foot" id="mFoot">
      <button class="btn btn-ghost" id="mClose2"><i class="bi bi-x-circle"></i> Close</button>
      <button class="btn btn-wa" id="mApply"><i class="bi bi-whatsapp"></i> WhatsApp</button>
      <button class="btn btn-primary" id="mOnline"><i class="bi bi-send-fill"></i> Apply online</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="/config.js"></script>

var $ = function(id){ return document.getElementById(id); };
var ALL = [], VIEW = [], shown = PAGE, typeFilter = '', current = null, db = null, STATS = {};

/* ---------- helpers ---------- */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
function money(n){ return (n==null||n===''||isNaN(n)) ? null : 'Ksh ' + Number(n).toLocaleString('en-KE'); }
function salaryText(j){
  var a = money(j.salary_min), b = money(j.salary_max);
  if (a && b) return a + ' – ' + b;
  return a || b || j.salary_range || '';
}
function fmtDate(d){ if(!d) return '—'; var x=new Date(d); return isNaN(x)?'—':x.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function ago(d){
  if(!d) return ''; var s=(Date.now()-new Date(d).getTime())/1000; if(isNaN(s)) return '';
  if (s<3600) return Math.max(1,Math.round(s/60))+' min ago';
  if (s<86400) return Math.round(s/3600)+' hr ago';
  var days=Math.round(s/86400); if (days<30) return days+(days===1?' day ago':' days ago');
  return fmtDate(d);
}
function closes(d){
  if(!d) return ''; var days=Math.ceil((new Date(d+'T23:59:59').getTime()-Date.now())/86400000);
  if (isNaN(days)) return '';
  if (days<0) return 'Deadline passed';
  if (days===0) return 'Closes today';
  if (days===1) return 'Closes tomorrow';
  return 'Closes in '+days+' days';
}
function cap(s){ s=String(s||''); return s.charAt(0).toUpperCase()+s.slice(1); }
function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('show'); },2400); }
function find(id){ for (var i=0;i<ALL.length;i++) if (String(ALL[i].id)===String(id)) return ALL[i]; return null; }
function st(j){ return STATS[j.id] || { views:0, apply_clicks:0, applications:0 }; }
function visitor(){
  try { var v=localStorage.getItem('sc_vid'); if(!v){ v=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Math.random()).slice(2)+Date.now(); localStorage.setItem('sc_vid',v);} return v; }
  catch(e){ return null; }
}

/* logo fallback */
document.querySelectorAll('img[data-logo]').forEach(function(img){
  function fix(){ img.onerror=null; img.src=LOGO_FALLBACK; }
  img.addEventListener('error', fix);
  if (img.complete && img.naturalWidth===0) fix();
});

/* ---------- data ---------- */
function connect(){
  var c = window.SOUNDS_CONFIG;
  if (!c || !c.supabaseUrl || !c.supabaseKey) throw new Error('Site configuration (config.js) was not found.');
  db = window.supabase.createClient(c.supabaseUrl, c.supabaseKey);
}
async function loadStats(){
  try {
    var r = await db.rpc('get_public_job_stats');
    if (r.error || !r.data) return;
    STATS = {};
    r.data.forEach(function(x){ STATS[x.job_id] = { views:Number(x.views)||0, apply_clicks:Number(x.apply_clicks)||0, applications:Number(x.applications)||0 }; });
  } catch(e){ console.warn('stats unavailable', e); }
}
function record(j, evt){
  if (!db || !j) return;
  db.rpc('record_job_event', { p_job_id:j.id, p_event:evt, p_visitor:visitor() })
    .then(function(){ return loadStats(); })
    .then(function(){ render(); if (current && current.id===j.id) fillKpis(j); })
    .catch(function(e){ console.warn('insight not recorded', e); });
}
async function load(){
  try { connect(); } catch(e){ fail(e.message); return; }
  await readSession();
  try { db.auth.onAuthStateChange(function(ev, sess){ setTimeout(function(){ setUser(sess && sess.user); }, 0); }); } catch(e){}
  var res = await db.from('job_postings').select('*').eq('status','active').order('created_at',{ascending:false});
  if (res.error){ console.error(res.error); fail('Could not load jobs: ' + res.error.message); return; }
  ALL = (res.data||[]).filter(function(j){ return !j.is_paused && !j.is_closed; });
  await loadStats();
  buildChips();
  $('sJobs').textContent = ALL.length;
  $('sApps').textContent = ALL.reduce(function(n,j){ return n + st(j).applications; }, 0);
  filter();
}
function fail(msg){
  $('count').textContent = '';
  $('grid').innerHTML = '<div class="empty err"><i class="bi bi-exclamation-triangle"></i>' + esc(msg) + '</div>';
}

/* ---------- filters ---------- */
function buildChips(){
  var types = []; ALL.forEach(function(j){ if (j.job_type && types.indexOf(j.job_type)===-1) types.push(j.job_type); });
  var h = '<button class="chip on" data-type=""><i class="bi bi-grid"></i> All</button>';
  types.forEach(function(t){ h += '<button class="chip" data-type="' + esc(t) + '"><i class="bi bi-clock"></i> ' + esc(cap(t)) + '</button>'; });
  if (ALL.some(function(j){ return j.is_featured; })) h += '<button class="chip" data-type="__feat"><i class="bi bi-star-fill"></i> Featured</button>';
  $('chips').innerHTML = h;
}
function filter(){
  var q = $('q').value.trim().toLowerCase();
  VIEW = ALL.filter(function(j){
    if (typeFilter === '__feat'){ if (!j.is_featured) return false; }
    else if (typeFilter && j.job_type !== typeFilter) return false;
    if (q){
      var hay = [j.title,j.job_role,j.category,j.location,j.county,j.city,j.company_name].join(' ').toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
  shown = PAGE; render();
}

/* ---------- list ---------- */
function card(j){
  var applied = isApplied(j.id), s = st(j), sal = salaryText(j), where = j.location || j.city || '', cl = closes(j.deadline);
  var badges = (j.is_featured ? '<span class="badge b-feat"><i class="bi bi-star-fill"></i> Featured</span>' : '') +
               (j.is_urgent ? '<span class="badge b-urg"><i class="bi bi-lightning-charge-fill"></i> Urgent</span>' : '');
  var meta = '';
  if (where) meta += '<span class="m"><i class="bi bi-geo-alt-fill"></i>' + esc(where) + '</span>';
  if (j.job_type) meta += '<span class="m"><i class="bi bi-clock-fill"></i>' + esc(cap(j.job_type)) + '</span>';
  if (j.work_type) meta += '<span class="m"><i class="bi bi-house-door-fill"></i>' + esc(j.work_type) + '</span>';
  if (sal) meta += '<span class="m sal"><i class="bi bi-cash-stack"></i>' + esc(sal) + '</span>';
  var apps = s.applications > 0
    ? '<span class="hot"><i class="bi bi-people-fill"></i>' + s.applications + (s.applications===1?' application':' applications') + '</span>'
    : '<span><i class="bi bi-people"></i>Be the first to apply</span>';
  return '<article class="job' + (j.is_featured?' feat':'') + '">' +
    '<div class="job-top"><div class="avatar"><i class="bi bi-' + (j.is_featured?'star-fill':'briefcase-fill') + '"></i></div>' +
    '<div style="min-width:0"><h3 class="job-title" data-act="view" data-id="' + esc(j.id) + '">' + esc(j.title||'Untitled job') + '</h3>' +
    '<div class="job-emp"><i class="bi bi-building"></i>' + esc(j.company_name||'SoundsCare') + (j.company_verified?' <i class="bi bi-patch-check-fill" title="Verified"></i>':'') + '</div></div></div>' +
    (badges ? '<div class="badges">' + badges + '</div>' : '') +
    '<div class="meta">' + meta + '</div>' +
    (j.description ? '<p class="snip">' + esc(j.description) + '</p>' : '') +
    '<div class="stats">' + apps +
      '<span><i class="bi bi-eye"></i>' + s.views + ' views</span>' +
      (cl ? '<span><i class="bi bi-calendar-event"></i>' + esc(cl) + '</span>' : '') +
      (j.created_at ? '<span><i class="bi bi-clock-history"></i>' + esc(ago(j.created_at)) + '</span>' : '') + '</div>' +
    '<div class="actions">' +
      '<button class="btn btn-ghost" data-act="view" data-id="' + esc(j.id) + '"><i class="bi bi-eye"></i> Details</button>' +
      (applied
        ? '<button class="btn btn-ghost" disabled><i class="bi bi-check-circle-fill" style="color:var(--ok)"></i> Applied</button>'
        : '<button class="btn btn-primary" data-act="apply" data-id="' + esc(j.id) + '"><i class="bi bi-send-fill"></i> Apply</button>') +
      '<button class="btn btn-wa btn-icon" data-act="wa" data-id="' + esc(j.id) + '" title="Apply on WhatsApp" aria-label="Apply on WhatsApp"><i class="bi bi-whatsapp"></i></button>' +
    '</div></article>';
}
function render(){
  $('count').textContent = VIEW.length + (VIEW.length===1 ? ' job found' : ' jobs found');
  if (!VIEW.length){
    $('grid').innerHTML = '<div class="empty"><i class="bi bi-search"></i>' +
      (ALL.length ? 'No jobs match your search. Try different words.' : 'No jobs available right now. Please check back soon.') + '</div>';
    $('more').style.display = 'none'; return;
  }
  $('grid').innerHTML = VIEW.slice(0, shown).map(card).join('');
  $('more').style.display = VIEW.length > shown ? 'flex' : 'none';
}

/* ---------- WhatsApp apply ---------- */
function waLink(j){
  var where = (j.location || j.city) ? ' (' + (j.location || j.city) + ')' : '';
  var msg = 'Hi SoundsCare, I would like to apply for the job: ' + (j.title||'') + where + '.' + ((j.short_code||j.id) ? ' Job ID: ' + (j.short_code||j.id) : '');
  return 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(msg);
}
function whatsapp(j){
  if (!j) return;
  record(j, 'apply_click');
  window.open(waLink(j), '_blank', 'noopener');
}

/* ---------- details ---------- */
function fact(icon, label, val){ return val ? '<div class="fact"><i class="bi bi-' + icon + '"></i><div><small>' + esc(label) + '</small><span>' + esc(val) + '</span></div></div>' : ''; }
function fillKpis(j){
  var s = st(j), k = $('kpis'); if (!k) return;
  k.innerHTML =

    '<div class="kpi"><i class="bi bi-people-fill"></i><b>' + s.applications + '</b><small>Applications</small></div>' +
    '<div class="kpi"><i class="bi bi-whatsapp"></i><b>' + s.apply_clicks + '</b><small>WhatsApp enquiries</small></div>';

function shell(j){
  current = j;
  $('mTitle').textContent = j.title || 'Job';

function setMode(m){ $('mFoot').style.display = (m === 'details') ? 'flex' : 'none'; }
function view(id, noRecord){

    '<div class="kpis" id="kpis"></div>' +

    '</div>' +

function closeModal(){ $('overlay').style.display = 'none'; document.body.style.overflow = ''; current = null; setMode('details'); }

/* ---------- online apply (with or without an account) ---------- */
var TERMS_URL = '';                   // optional: link to your terms page, e.g. '/terms.html'
var auth = { user:null, email:'' };   // signed-in user (if any)
var pref = { name:'', phone:'', email:'' };   // values used to pre-fill the forms
var tab = 'guest';
var APPLIED = [];
try { APPLIED = JSON.parse(localStorage.getItem('sc_applied') || '[]'); } catch(e){}
function isApplied(id){ return APPLIED.indexOf(String(id)) !== -1; }
function markApplied(id){
  id = String(id); if (APPLIED.indexOf(id) === -1) APPLIED.push(id);
  try { localStorage.setItem('sc_applied', JSON.stringify(APPLIED)); } catch(e){}
}

async function readSession(){
  try { var r = await db.auth.getSession(); await setUser(r && r.data && r.data.session && r.data.session.user); } catch(e){}
}
async function setUser(u){
  if (u && !u.is_anonymous){
    var m = u.user_metadata || {};
    auth = { user:u, email:u.email || '' };
    pref = { name:m.full_name || '', phone:m.phone || '', email:u.email || '' };
    try {
      var r = await db.from('users').select('full_name,phone').eq('id', u.id).maybeSingle();
      if (r && r.data){ if (r.data.full_name) pref.name = r.data.full_name; if (r.data.phone) pref.phone = r.data.phone; }
    } catch(e){}
  } else {
    auth = { user:null, email:'' };
  }
}

function fld(id, label, type, icon, val, ac, ph){
  return '<label class="lab" for="' + id + '">' + label + '</label><div class="inp"><i class="bi bi-' + icon + '"></i>' +
    '<input id="' + id + '" type="' + type + '" value="' + esc(val || '') + '" autocomplete="' + (ac || 'off') + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : '') + '></div>';
}
function applyForm(){
  return '<form data-form="apply" novalidate>' +
    fld('a_name', 'Full name *', 'text', 'person', pref.name, 'name') +
    fld('a_phone', 'Phone / WhatsApp number *', 'tel', 'telephone', pref.phone, 'tel', 'e.g. 0712 345 678') +
    fld('a_email', 'Email (optional)', 'email', 'envelope', pref.email, 'email') +
    '<label class="lab" for="a_msg">Message (optional)</label><textarea id="a_msg" maxlength="1000" placeholder="Tell the employer a little about yourself and your experience…"></textarea>' +
    '<input type="text" id="a_hp" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">' +
    '<button class="btn btn-primary btn-block" type="submit" id="aBtn"><i class="bi bi-send-fill"></i> Submit application</button></form>';
}
function signinForm(){
  return '<form data-form="signin" novalidate>' +
    fld('s_email', 'Email', 'email', 'envelope', pref.email, 'email') +
    fld('s_pass', 'Password', 'password', 'lock', '', 'current-password') +
    '<button class="btn btn-primary btn-block" type="submit" id="aBtn"><i class="bi bi-box-arrow-in-right"></i> Sign in &amp; continue</button>' +
    '<div style="text-align:center;margin-top:10px"><button type="button" class="linkbtn" data-do="forgot">Forgot password?</button></div></form>';
}
function signupForm(){
  return '<form data-form="signup" novalidate>' +
    fld('u_name', 'Full name', 'text', 'person', pref.name, 'name') +
    fld('u_phone', 'Phone number', 'tel', 'telephone', pref.phone, 'tel', 'e.g. 0712 345 678') +
    fld('u_email', 'Email', 'email', 'envelope', pref.email, 'email') +
    fld('u_pass', 'Password (at least 8 characters)', 'password', 'lock', '', 'new-password') +
    '<label class="chk"><input type="checkbox" id="u_terms"><span>I agree to the SoundsCare terms and privacy policy' +
      (TERMS_URL ? ' (<a href="' + esc(TERMS_URL) + '" target="_blank" rel="noopener">read</a>)' : '') + '.</span></label>' +
    '<button class="btn btn-primary btn-block" type="submit" id="aBtn"><i class="bi bi-person-plus-fill"></i> Create account &amp; continue</button></form>';
}
function segBtn(t, icon, label){ return '<button type="button" data-tab="' + t + '" class="' + (tab === t ? 'on' : '') + '"><i class="bi bi-' + icon + '"></i>' + label + '</button>'; }

function showApply(msg, type){
  var j = current; if (!j) return;
  shell(j); setMode('apply');
  var h = '<button class="linkbtn" data-do="back"><i class="bi bi-arrow-left"></i> Job details</button>' +
          '<h3 class="a-title">Apply for this job</h3>';
  if (auth.user){
    h += '<div class="note"><i class="bi bi-person-check-fill"></i><span>Signed in as <b>' + esc(auth.email) + '</b></span>' +
         '<button class="linkbtn" data-do="signout">Sign out</button></div><div id="aMsg" class="amsg"></div>' + applyForm();
  } else {
    h += '<div class="seg">' + segBtn('guest', 'person-fill', 'Without account') + segBtn('signin', 'box-arrow-in-right', 'Sign in') + segBtn('signup', 'person-plus-fill', 'Create account') + '</div>' +
         '<div id="aMsg" class="amsg"></div>';
    if (tab === 'guest') h += '<p class="hint">No account needed. We will contact you on the number you give.</p>' + applyForm();
    else if (tab === 'signin') h += signinForm();
    else h += signupForm();
  }
  h += '<div class="or"><span>or</span></div>' +
       '<button class="btn btn-wa btn-block" data-do="wa"><i class="bi bi-whatsapp"></i> Apply on WhatsApp instead</button>';
  $('mBody').innerHTML = h;
  $('mBody').scrollTop = 0;
  if (msg) amsg(msg, type);
}
function amsg(text, type){
  var el = $('aMsg'); if (!el) return;
  var icon = type === 'ok' ? 'check-circle-fill' : type === 'info' ? 'info-circle-fill' : 'exclamation-circle-fill';
  el.className = 'amsg ' + (type || 'err');
  el.innerHTML = text ? '<i class="bi bi-' + icon + '"></i><span>' + esc(text) + '</span>' : '';
}
function busy(on, label){
  var b = $('aBtn'); if (!b) return;
  if (on){ b.disabled = true; b._h = b.innerHTML; b.innerHTML = '<span class="spin"></span> ' + (label || 'Please wait…'); }
  else { b.disabled = false; if (b._h) b.innerHTML = b._h; }
}
var emailOk = function(v){ return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v); };
var digits = function(v){ return String(v||'').replace(/\D/g,''); };

async function doSignin(){
  var email = $('s_email').value.trim(), pass = $('s_pass').value;
  if (!emailOk(email) || !pass) return amsg('Enter your email and password.', 'err');
  busy(true, 'Signing in…');
  var r = await db.auth.signInWithPassword({ email:email, password:pass });
  if (r.error){ busy(false); return amsg(r.error.message, 'err'); }
  await setUser(r.data.user);
  showApply('Signed in. Check your details and submit.', 'ok');
}
async function doSignup(){
  var name = $('u_name').value.trim(), phone = $('u_phone').value.trim(), email = $('u_email').value.trim(), pass = $('u_pass').value;
  if (name.length < 2) return amsg('Please enter your full name.', 'err');
  if (digits(phone).length < 9) return amsg('Enter a valid phone number.', 'err');
  if (!emailOk(email)) return amsg('Enter a valid email address.', 'err');
  if (pass.length < 8) return amsg('Password must be at least 8 characters.', 'err');
  if (!$('u_terms').checked) return amsg('Please accept the terms to create an account.', 'err');
  pref = { name:name, phone:phone, email:email };
  busy(true, 'Creating account…');
  var r = await db.auth.signUp({ email:email, password:pass, options:{
    data:{ full_name:name, phone:phone, terms_accepted:true, receive_updates:false },
    emailRedirectTo: location.origin + location.pathname } });
  if (r.error){ busy(false); return amsg(r.error.message, 'err'); }
  if (r.data && r.data.user && r.data.user.identities && r.data.user.identities.length === 0){
    tab = 'signin'; showApply('This email already has an account. Please sign in.', 'info'); return;
  }
  if (r.data && r.data.session){
    await setUser(r.data.session.user);
    showApply('Account created. Check your details and submit.', 'ok');
  } else {
    tab = 'guest';
    showApply('Account created. We sent a confirmation link to ' + email + '. Confirm it later, and apply now without waiting.', 'ok');
  }
}
var REASONS = {
  invalid_name: 'Please enter your full name.',
  invalid_phone: 'Enter a valid phone number, for example 0712 345 678.',
  invalid_email: 'That email address does not look right.',
  duplicate: 'You have already applied for this job.',
  job_unavailable: 'Sorry, this job is no longer open.',
  too_many: 'You have sent too many applications today. Please try again tomorrow.',
  busy: 'We are receiving a lot of applications right now. Please try again shortly or use WhatsApp.'
};
async function submitApply(){
  if ($('a_hp') && $('a_hp').value){ return showDone(''); }      // bots fill the hidden field
  var name = $('a_name').value.trim(), phone = $('a_phone').value.trim(), email = $('a_email').value.trim(), msg = $('a_msg').value.trim();
  if (name.length < 2) return amsg('Please enter your full name.', 'err');
  if (digits(phone).length < 9) return amsg('Enter a valid phone number, for example 0712 345 678.', 'err');
  if (email && !emailOk(email)) return amsg('That email address does not look right.', 'err');
  busy(true, 'Sending…');
  var r = await db.rpc('submit_job_application', { p_job_id:current.id, p_name:name, p_phone:phone, p_email:email || null, p_message:msg || null });
  if (r.error){ busy(false); console.error(r.error); return amsg('We could not send your application. Please try again or apply on WhatsApp.', 'err'); }
  var res = r.data || {};
  if (!res.ok){
    busy(false);
    if (res.reason === 'duplicate'){ markApplied(current.id); render(); }
    return amsg(REASONS[res.reason] || 'We could not send your application. Please try again.', 'err');
  }
  markApplied(current.id);
  await loadStats(); render();
  showDone(phone);
}
function showDone(phone){
  setMode('done');
  $('mBody').innerHTML = '<div class="done"><i class="bi bi-check-circle-fill big"></i><h3>Application sent!</h3>' +
    '<p>Thank you. ' + (phone ? 'We will contact you on <b>' + esc(phone) + '</b> if you are shortlisted.' : 'We will be in touch soon.') + '</p>' +
    '<button class="btn btn-primary" data-do="close"><i class="bi bi-check2"></i> Done</button></div>';
}

/* ---------- events ---------- */
$('q').addEventListener('input', filter);
$('chips').addEventListener('click', function(e){
  var b = e.target.closest('.chip'); if (!b) return;
  typeFilter = b.getAttribute('data-type') || '';
  document.querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('on', c === b); });
  filter();
});
$('grid').addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if (!el) return;
  var j = find(el.getAttribute('data-id')); if (!j) return;
  var a = el.getAttribute('data-act');
  if (a === 'view') view(j.id);
  else if (a === 'apply'){ shell(j); showApply(); }
  else if (a === 'wa') whatsapp(j);
});
$('mBody').addEventListener('click', async function(e){
  var t = e.target.closest('[data-tab],[data-do]'); if (!t) return;
  if (t.hasAttribute('data-tab')){ tab = t.getAttribute('data-tab'); showApply(); return; }
  var d = t.getAttribute('data-do');
  if (d === 'back') view(current.id, true);
  else if (d === 'close') closeModal();
  else if (d === 'wa') whatsapp(current);
  else if (d === 'signout'){ try { await db.auth.signOut(); } catch(err){} await setUser(null); showApply('You have signed out.', 'info'); }
  else if (d === 'forgot'){
    var em = ($('s_email').value || '').trim();
    if (!emailOk(em)) return amsg('Type your email above first, then tap "Forgot password?".', 'err');
    var r = await db.auth.resetPasswordForEmail(em, { redirectTo: location.origin + location.pathname });
    amsg(r.error ? r.error.message : 'If that email has an account, a password reset link is on its way.', r.error ? 'err' : 'ok');
  }
});
$('mBody').addEventListener('submit', function(e){
  e.preventDefault();
  var f = e.target.getAttribute('data-form');
  if (f === 'apply') submitApply(); else if (f === 'signin') doSignin(); else if (f === 'signup') doSignup();
});
$('moreBtn').addEventListener('click', function(){ shown += PAGE; render(); });
$('mClose').addEventListener('click', closeModal);
$('mClose2').addEventListener('click', closeModal);

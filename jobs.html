<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jobs — SoundsCare</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/modal.css">
<link rel="stylesheet" href="css/tables.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
  /* public page: no sidebar, full width */
  body { margin: 0; }
  .pub-wrap { max-width: 1150px; margin: 0 auto; padding: 24px 16px 48px; }
  .pub-head { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:18px; }
  .pub-head h1 { margin:0; font-size:26px; }
  .pub-head p { margin:4px 0 0; opacity:.7; font-size:14px; }
  .pub-brand { font-weight:800; font-size:18px; text-decoration:none; color:inherit; }
</style>
</head>
<body data-page="jobs" data-mode="public">

<div class="pub-wrap">
  <div class="pub-head">
    <div>
      <a class="pub-brand" href="/"><i class="bi bi-heart-fill"></i> SoundsCare</a>
      <h1>Job Openings</h1>
      <p>Browse available jobs and apply directly on WhatsApp.</p>
    </div>
  </div>

  <div class="section">
    <div class="search-bar">
      <input class="search-input" id="jobs-search" placeholder="🔍 Search job title, location…" oninput="filterJobs()">
      <select class="filter-select" id="jobs-featured-filter" onchange="filterJobs()">
        <option value="">All Jobs</option>
        <option value="featured">Featured Only</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Title</th><th>Employer</th><th>Location</th><th>Type</th><th>Salary</th><th>Status</th><th>Posted</th><th>Actions</th></tr></thead>
        <tbody id="jobs-tbody"><tr><td colspan="8" style="text-align:center">Loading…</td></tr></tbody>
      </table>
    </div>
    <div class="pagination" id="jobs-pagination"></div>
  </div>
</div>

<script src="/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/jobs.js"></script>
<script>
  // No login required: just load the jobs
  initJobsPage();
</script>
</body>
</html>

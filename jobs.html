<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  /* SoundsCare brand colours */
  :root{
    --blue:#1a6cf0; --blue-d:#0b4fd0; --teal:#14b8a6; --teal-d:#0a948a;
    --bg:#f5f7fb; --surface:#fff; --surface-2:#f0f3f9; --line:#e2e7f0; --text:#101828; --muted:#5b6678;
    --ok:#0f9d6b; --bad:#d92d20; --info-bg:#e4eefe; --wa:#25d366; --wa-d:#1ea952;
    --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0c111b; --surface:#141b29; --surface-2:#1b2434; --line:#27324a; --text:#eef2fa; --muted:#9aa6bd; --info-bg:#12254a; --shadow:none; }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,select{font:inherit;color:inherit}

  .topbar{background:var(--surface);border-bottom:1px solid var(--line)}
  .topbar-in{max-width:1150px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--text);text-decoration:none}
  .brand img{height:34px;width:auto;display:block}
  .brand span{color:var(--blue)}

  .hero{background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff}
  .hero-in{max-width:1150px;margin:0 auto;padding:30px 16px}
  .hero h1{margin:0 0 6px;font-size:28px;font-weight:800;letter-spacing:-.01em}
  .hero p{margin:0;opacity:.92;font-size:15px}

  .wrap{max-width:1150px;margin:0 auto;padding:20px 16px 56px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}

  .search-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .search-input,.filter-select{padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);outline:none;font-size:14px}
  .search-input{flex:1 1 240px;min-width:0}
  .search-input:focus,.filter-select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,108,240,.18)}

  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--surface-2)}
  .tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:middle}
  .tag-feat{background:var(--info-bg);color:var(--blue)}
  .tag-urg{background:rgba(217,45,32,.12);color:var(--bad)}
  .msg-row td{text-align:center;padding:28px;color:var(--muted)}
  .msg-err{color:var(--bad)!important}

  .btn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;border:1px solid transparent;cursor:pointer;padding:10px 16px;font-size:14px;font-weight:600;transition:.15s}
  .btn-sm{padding:7px 12px;font-size:13px}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:hover{background:var(--blue-d)}
  .btn-wa{background:var(--wa);color:#06361a}
  .btn-wa:hover{background:var(--wa-d)}
  .btn-secondary{background:var(--surface);border-color:var(--line);color:var(--text)}
  .btn-secondary:hover{background:var(--surface-2)}
  .acts{white-space:nowrap}

  .pagination{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}

  .modal-overlay{display:none;position:fixed;inset:0;z-index:1000;background:rgba(10,14,24,.6);align-items:center;justify-content:center;padding:16px}
  .modal{background:var(--surface);border-radius:16px;width:100%;max-width:680px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
  .modal-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .modal-header h2{margin:0;font-size:18px;font-weight:700}
  .modal-close{background:none;border:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
  .modal-body{padding:18px 20px;overflow-y:auto}
  .modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 20px;margin-bottom:6px}
  .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .val{font-size:14px;margin-bottom:10px}
  hr{border:none;border-top:1px solid var(--line);margin:12px 0}

  @media (max-width:720px){
    .hero h1{font-size:23px}
    th:nth-child(2),td:nth-child(2),th:nth-child(4),td:nth-child(4),th:nth-child(6),td:nth-child(6){display:none}
    td,th{padding:10px}
    .modal-footer .btn{flex:1 1 100%;justify-content:center}
  }
</style>
</head>

<section class="hero"><div class="hero-in">
  <h1>Job Openings</h1>
  <p>Browse available jobs and apply directly on WhatsApp.</p>
</div></section>

<main class="wrap"><div class="card">
  <div class="search-bar">
    <input class="search-input" id="q" placeholder="Search job title, location…" autocomplete="off">
    <select class="filter-select" id="feat">
      <option value="">All Jobs</option>
      <option value="1">Featured Only</option>
    </select>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Title</th><th>Employer</th><th>Location</th><th>Type</th><th>Salary</th><th>Posted</th><th>Actions</th></tr></thead>
      <tbody id="tbody"><tr class="msg-row"><td colspan="7">Loading…</td></tr></tbody>
    </table>
  </div>
  <div class="pagination" id="pager"></div>
</div></main>

<div id="jobModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><h2 id="mTitle">Job</h2><button class="modal-close" id="mClose" aria-label="Close">&times;</button></div>
    <div class="modal-body" id="mBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="mClose2">Close</button>
      <button class="btn btn-wa" id="mApply"><i class="bi bi-whatsapp"></i> Apply on WhatsApp</button>
    </div>
  </div>
</div>

<script src="/config.js"></script>
<script>
(function(){
'use strict';

/* ---------- settings ---------- */
var WHATSAPP = '254738123425';   // international format, no +
var TABLE = 'job_postings';
var PAGE_SIZE = 15;

/* The page tries each column name in order, so it works with most table layouts */
var F = {
  id:['id','job_id','uuid'], title:['title','job_title','name'], role:['job_role','role','category'],
  location:['location','city','town','area'], county:['county','region'],
  jobType:['job_type','type','employment_type'], workType:['work_type','arrangement'],
  salMin:['salary_min','min_salary','salary_from'], salMax:['salary_max','max_salary','salary_to'], salary:['salary_range','salary'], shortCode:['short_code'],
  description:['description','job_description','details'], requirements:['requirements','qualifications'],
  deadline:['deadline','closing_date','expires_at','expiry_date'], slots:['slots','vacancies','positions'],
  featured:['is_featured','featured'], urgent:['is_urgent','urgent'],
  status:['status','state'], employer:['employer_name','company_name','company','employer'],
  created:['created_at','posted_at','inserted_at']
};
var LIVE = ['active'];

var ALL = [], VIEW = [], page = 1, current = null;
var $ = function(id){ return document.getElementById(id); };

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
function pick(r, names){ for (var i=0;i<names.length;i++){ var v=r[names[i]]; if (v!==undefined && v!==null && v!=='') return v; } return null; }
function money(n){ return (n==null||n===''||isNaN(n)) ? null : 'Ksh ' + Number(n).toLocaleString('en-KE'); }
function fmtDate(d){ if(!d) return '—'; var x=new Date(d); return isNaN(x)?'—':x.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function truthy(v){ return v===true || v==='true' || v===1 || v==='1'; }

function normalise(r){
  var j = {};
  Object.keys(F).forEach(function(k){ j[k] = pick(r, F[k]); });
  if (typeof j.employer === 'object') j.employer = null;
  j.employer = j.employer || 'SoundsCare';
  j.featured = truthy(j.featured);
  j.urgent = truthy(j.urgent);
  j.status = j.status ? String(j.status).toLowerCase() : 'active';
  j.hidden = truthy(r.is_paused) || truthy(r.is_closed);
  return j;
}
function salaryText(j){
  var a = money(j.salMin), b = money(j.salMax);
  if (a && b) return a + ' – ' + b;
  return a || b || (j.salary ? esc(j.salary) : '—');
}

/* ---------- WhatsApp apply ---------- */
function waLink(j){
  var where = j.location ? ' (' + j.location + ')' : '';
  var msg = 'Hi SoundsCare, I would like to apply for the job: ' + (j.title||'') + where + '.' + ((j.shortCode||j.id)!=null ? ' Job ID: ' + (j.shortCode||j.id) : '');
  return 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(msg);
}
function find(id){ for (var i=0;i<ALL.length;i++) if (String(ALL[i].id)===String(id)) return ALL[i]; return null; }
function apply(id){ var j=find(id); if (j) window.open(waLink(j), '_blank', 'noopener'); }

/* ---------- load ---------- */
function client(){
  var c = window.SOUNDS_CONFIG;
  if (!c || !c.supabaseUrl || !c.supabaseKey) throw new Error('Site configuration (config.js) was not found.');
  return window.supabase.createClient(c.supabaseUrl, c.supabaseKey);
}
function showMsg(text, isErr){
  $('tbody').innerHTML = '<tr class="msg-row"><td colspan="7" class="' + (isErr?'msg-err':'') + '">' + esc(text) + '</td></tr>';
  $('pager').innerHTML = '';
}
async function load(){
  var db;
  try { db = client(); } catch(e){ showMsg(e.message, true); return; }
  var res = await db.from(TABLE).select('*').order('created_at', { ascending:false });
  if (res.error) res = await db.from(TABLE).select('*');   // retry if the order column differs
  if (res.error){ console.error(res.error); showMsg('Could not load jobs: ' + res.error.message, true); return; }
  ALL = (res.data||[]).map(normalise).filter(function(j){ return LIVE.indexOf(j.status) !== -1 && !j.hidden; });
  filter();
}

/* ---------- list ---------- */
function filter(){
  var q = $('q').value.trim().toLowerCase(), f = $('feat').value;
  VIEW = ALL.filter(function(j){
    if (f && !j.featured) return false;
    if (q){ var hay = [j.title,j.role,j.location,j.county,j.employer].join(' ').toLowerCase(); if (hay.indexOf(q)===-1) return false; }
    return true;
  });
  page = 1; render();
}
function render(){
  if (!VIEW.length){ showMsg(ALL.length ? 'No jobs match your search.' : 'No jobs available right now. Please check back soon.', false); return; }
  var rows = VIEW.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);
  $('tbody').innerHTML = rows.map(function(j){
    var id = esc(j.id);
    return '<tr>' +
      '<td><strong>' + esc(j.title||'Untitled') + '</strong>' + (j.featured?'<span class="tag tag-feat">Featured</span>':'') + (j.urgent?'<span class="tag tag-urg">Urgent</span>':'') + '</td>' +
      '<td>' + esc(j.employer) + '</td>' +
      '<td>' + esc(j.location||'—') + '</td>' +
      '<td style="text-transform:capitalize">' + esc(j.jobType||'—') + '</td>' +
      '<td>' + salaryText(j) + '</td>' +
      '<td>' + esc(fmtDate(j.created)) + '</td>' +
      '<td class="acts"><button class="btn btn-secondary btn-sm" data-act="view" data-id="' + id + '"><i class="bi bi-eye"></i> View</button> ' +
      '<button class="btn btn-wa btn-sm" data-act="apply" data-id="' + id + '"><i class="bi bi-whatsapp"></i> Apply</button></td></tr>';
  }).join('');
  var pages = Math.ceil(VIEW.length / PAGE_SIZE), h = '';
  if (pages > 1) for (var i=1;i<=pages;i++) h += '<button class="btn btn-sm ' + (i===page?'btn-primary':'btn-secondary') + '" data-page="' + i + '">' + i + '</button>';
  $('pager').innerHTML = h;
}

/* ---------- details ---------- */
function row(label, html){ return '<div><div class="lbl">' + esc(label) + '</div><div class="val">' + html + '</div></div>'; }
function view(id){
  var j = find(id); if (!j) return;
  current = j;
  $('mTitle').textContent = j.title || 'Job';
  $('mBody').innerHTML =
    '<div class="grid">' +
      row('Location', esc([j.location, j.county].filter(Boolean).join(', ') || '—')) +
      row('Job type', esc(j.jobType||'—')) +
      row('Work type', esc(j.workType||'—')) +
      row('Salary', salaryText(j)) +
      row('Slots', esc(j.slots!=null?j.slots:'—')) +
      row('Deadline', esc(fmtDate(j.deadline))) +
      row('Posted', esc(fmtDate(j.created))) +
    '</div><hr>' +
    row('Job description', j.description ? nl2br(j.description) : '<em style="color:var(--muted)">No description added.</em>') +
    row('Requirements', j.requirements ? nl2br(j.requirements) : '<em style="color:var(--muted)">No requirements added.</em>');
  $('jobModal').style.display = 'flex';
}
function closeModal(){ $('jobModal').style.display = 'none'; current = null; }

/* ---------- events ---------- */
$('q').addEventListener('input', filter);
$('feat').addEventListener('change', filter);
$('tbody').addEventListener('click', function(e){
  var b = e.target.closest('button[data-act]'); if (!b) return;
  if (b.dataset.act === 'view') view(b.dataset.id); else apply(b.dataset.id);
});
$('pager').addEventListener('click', function(e){
  var b = e.target.closest('button[data-page]'); if (!b) return;
  page = Number(b.dataset.page); render(); window.scrollTo({ top: 0, behavior: 'smooth' });
});
$('mClose').addEventListener('click', closeModal);
$('mClose2').addEventListener('click', closeModal);
$('jobModal').addEventListener('click', function(e){ if (e.target === this) closeModal(); });
$('mApply').addEventListener('click', function(){ if (current) apply(current.id); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeModal(); });

load();
})();
</script>
</body>
</html>

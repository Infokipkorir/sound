<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | SoundsCare</title>
<meta name="description" content="This page could not be found. Browse jobs, find a helper or contact SoundsCare support.">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#1a6cf0">
<link rel="icon" href="/icons/icon-96.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  :root{--blue:#1a6cf0;--blue-d:#0b4fd0;--teal:#14b8a6;--bg:#f5f7fb;--surface:#fff;--line:#e2e7f0;--text:#101828;--muted:#5b6678;--blue-bg:#e4eefe}
  @media (prefers-color-scheme:dark){:root{--bg:#0c111b;--surface:#141b29;--line:#27324a;--text:#eef2fa;--muted:#9aa6bd;--blue-bg:#12254a}}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
  .top{padding:14px 5%}
  .brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:800;font-size:1.3rem}
  .brand img{width:38px;height:38px;object-fit:contain}
  main{flex:1;display:grid;place-items:center;padding:20px 16px 40px}
  .card{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:34px 26px 28px;text-align:center;box-shadow:0 1px 2px rgba(16,24,40,.06),0 14px 40px rgba(16,24,40,.08)}
  .code{font-size:84px;font-weight:800;line-height:1;letter-spacing:-.04em;background:linear-gradient(135deg,var(--blue),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
  .ic{width:64px;height:64px;border-radius:18px;background:var(--blue-bg);color:var(--blue);display:grid;place-items:center;font-size:30px;margin:0 auto 14px}
  h1{margin:10px 0 8px;font-size:24px;font-weight:800;letter-spacing:-.02em}
  p{margin:0 auto;color:var(--muted);font-size:15px;line-height:1.6;max-width:400px}
  .actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:24px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;text-decoration:none;border:1px solid var(--line);color:var(--text);background:var(--surface);transition:.15s}
  .btn:hover{border-color:var(--blue);color:var(--blue)}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.primary:hover{background:var(--blue-d);border-color:var(--blue-d);color:#fff}
  .path{margin-top:22px;padding-top:16px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--muted);word-break:break-all}
  .path code{background:var(--blue-bg);color:var(--blue);padding:2px 8px;border-radius:8px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .help{margin-top:8px;font-size:13px;color:var(--muted)}
  .help a{color:var(--blue);font-weight:700;text-decoration:none}
  .help a:hover{text-decoration:underline}
  footer{text-align:center;color:var(--muted);font-size:12.5px;padding:0 16px 22px}
</style>
</head>
<body>
<header class="top"><a class="brand" href="/" aria-label="SoundsCare home"><img src="/sound_logo.jpg" alt="" onerror="this.onerror=null;this.src='/icons/icon-96.png'"> SoundsCare</a></header>

<main>
  <div class="card" role="main">
    <div class="ic" id="icon"><i class="bi bi-compass"></i></div>
    <div class="code" id="code" aria-hidden="true">404</div>
    <h1 id="title">We can’t find that page</h1>
    <p id="msg">The link may be broken or the page may have moved. Here are some places to get you back on track.</p>
    <div class="actions" id="actions">
      <a class="btn primary" href="/"><i class="bi bi-house-door-fill"></i> Homepage</a>
      <a class="btn" href="/jobs"><i class="bi bi-briefcase-fill"></i> Browse jobs</a>
      <a class="btn" href="/employees"><i class="bi bi-people-fill"></i> Find a helper</a>
    </div>
    <div class="path">You tried to open <code id="path">/</code></div>
    <div class="help">Still stuck? <a href="/support">Contact support</a></div>
  </div>
</main>
<footer>© SoundsCare · House help, nannies and care givers in East Africa</footer>

<script>
(function(){
  var p = location.pathname || '/';
  try { p = decodeURI(p); } catch(e){}
  document.getElementById('path').textContent = (p.length > 70 ? p.slice(0, 67) + '…' : p);
  function set(icon, title, msg, actions){
    document.getElementById('icon').innerHTML = '<i class="bi bi-' + icon + '"></i>';
    document.getElementById('title').textContent = title;
    document.getElementById('msg').textContent = msg;
    if (actions) document.getElementById('actions').innerHTML = actions;
  }
  var A = {
    home: '<a class="btn primary" href="/"><i class="bi bi-house-door-fill"></i> Homepage</a>',
    jobs: '<a class="btn" href="/jobs"><i class="bi bi-briefcase-fill"></i> Browse jobs</a>',
    helpers: '<a class="btn" href="/employees"><i class="bi bi-people-fill"></i> Find a helper</a>'
  };
  if (/^\/w(\/|$)/i.test(p)) {
    set('person-x', 'Profile not available', 'This worker link may be wrong, or the worker has hidden their profile. Ask them to share their link again.',
        A.home.replace('primary', 'primary') + A.helpers);
  } else if (/^\/(j|job)(\/|$)/i.test(p)) {
    set('briefcase', 'Job no longer available', 'This job may have been filled, closed or removed. See the latest openings instead.',
        '<a class="btn primary" href="/jobs"><i class="bi bi-briefcase-fill"></i> Browse jobs</a>' + A.helpers);
  } else if (/^\/(agent|admin)(\/|$)/i.test(p)) {
    set('shield-exclamation', 'Page not found', 'That page does not exist or has moved. Use the links below to continue.',
        A.home + '<a class="btn" href="/agent/login"><i class="bi bi-box-arrow-in-right"></i> Agent login</a>');
  }
})();
</script>
</body>
</html>

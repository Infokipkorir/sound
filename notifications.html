<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — SoundsCare Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/sidebar.css"><link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/modal.css"><link rel="stylesheet" href="css/tables.css"><link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/forms.css"><link rel="stylesheet" href="css/responsive.css">
</head><body data-page="notifications">
<div id="maintenance-banner"><i class="bi bi-exclamation-triangle-fill"></i> Maintenance mode is ON.</div>
<div data-include="sidebar"></div>
<div class="main" id="main">
  <div data-include="topbar"></div>
  <div class="content">
    <div class="page-head"><div><h1>Notifications</h1><p>System and user notifications</p></div>
      <button class="btn btn-primary btn-sm" onclick="openComposeModal()"><i class="bi bi-megaphone"></i> Send Notification</button></div>
    <div class="section">
      <div class="table-wrap"><table><thead><tr><th>Title</th><th>Message</th><th>Recipient</th><th>Type</th><th>Read</th><th>Date</th></tr></thead>
      <tbody id="notif-tbody"><tr><td colspan="6" style="text-align:center">Loading…</td></tr></tbody></table></div>
      <div class="pagination" id="notif-pagination"></div>
    </div>
  </div>
</div>

<div id="send-notif-bulk-modal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header"><h2><i class="bi bi-megaphone"></i> Send Notification</h2><button class="modal-close" onclick="closeModal('send-notif-bulk-modal')">×</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Recipient</label>
        <select id="notif-to-type" onchange="updateNotifTo()"><option value="single">Single User (email)</option><option value="all">All Users</option><option value="workers">All Job Seekers</option><option value="employers">All Employers</option></select>
      </div>
      <div class="form-group" id="notif-to-email-group"><label>Email</label><input id="notif-to-email" placeholder="user@example.com"></div>
      <div class="form-group"><label>Title</label><input id="notif-title-input" placeholder="Notification title"></div>
      <div class="form-group"><label>Message</label><textarea id="notif-body-input" placeholder="Notification message…"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('send-notif-bulk-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="sendBulkNotification()"><i class="bi bi-send"></i> Send</button>
    </div>
  </div>
</div>
<div data-include="modal"></div><div data-include="toast"></div>
<script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/layout.js"></script>
<script src="js/auth.js"></script><script src="js/api.js"></script><script src="js/notifications.js"></script>
<script>
(async function(){
  await initLayout();
  const admin=await requireAuth();if(!admin)return;
  await initNotificationsPage();
  const params=new URLSearchParams(location.search);
  const compose=params.get('compose');
  if(compose){openComposeModal();document.getElementById('notif-to-type').value='single';updateNotifTo();document.getElementById('notif-to-email').value=compose;}
})();
</script>
</body></html>

<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics — SoundsCare Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/sidebar.css"><link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/modal.css"><link rel="stylesheet" href="css/tables.css"><link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/forms.css"><link rel="stylesheet" href="css/charts.css"><link rel="stylesheet" href="css/responsive.css">
</head><body data-page="analytics">
<div id="maintenance-banner"><i class="bi bi-exclamation-triangle-fill"></i> Maintenance mode is ON.</div>
<div data-include="sidebar"></div>
<div class="main" id="main">
  <div data-include="topbar"></div>
  <div class="content">
    <div class="page-head"><div><h1>Analytics</h1><p>Growth, revenue, and platform activity</p></div></div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Total Job Seekers</div><div class="stat-value" id="an-workers">—</div></div>
      <div class="stat-card"><div class="stat-label">Total Employers</div><div class="stat-value accent" id="an-employers">—</div></div>
      <div class="stat-card"><div class="stat-label">Revenue (Completed)</div><div class="stat-value accent" id="an-revenue">—</div></div>
      <div class="stat-card"><div class="stat-label">Active This Week</div><div class="stat-value sky" id="an-active">—</div></div>
    </div>
    <div class="dash-grid">
      <div class="section"><div class="section-header"><div class="section-title"><i class="bi bi-graph-up"></i> Growth — Last 30 Days</div></div>
        <div class="section-body"><canvas id="growth-chart" height="100"></canvas></div></div>
      <div class="section"><div class="section-header"><div class="section-title"><i class="bi bi-pie-chart-fill"></i> Job Seekers by County (Top 8)</div></div>
        <div class="section-body"><canvas id="county-chart" height="100"></canvas></div></div>
    </div>
    <div class="section"><div class="section-header"><div class="section-title"><i class="bi bi-cash-coin"></i> Revenue by Fee Type</div></div>
      <div class="section-body"><canvas id="revenue-chart" height="90"></canvas></div></div>
  </div>
</div>
<div data-include="modal"></div><div data-include="toast"></div>
<script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/layout.js"></script>
<script src="js/auth.js"></script><script src="js/api.js"></script><script src="js/analytics.js"></script>
<script>(async function(){await initLayout();const admin=await requireAuth();if(!admin)return;await initAnalyticsPage();})();</script>
</body></html>

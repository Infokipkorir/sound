<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Profile – SoundsCare</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
:root{--brand:#1b6b45;--brand2:#0f4a2f;--soft:#e8f4ee;--accent:#e8a040;--ink:#14231c;--muted:#6b7a72;--line:#e3ebe6}
body{font-family:'DM Sans',sans-serif;background:#f4f7f5;color:var(--ink)}
.wrap{max-width:980px;margin:0 auto;padding:0 12px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 4px}
.topbar a{color:var(--ink);text-decoration:none;font-weight:700}
.hero{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 4px 24px rgba(20,35,28,.07)}
.cover{height:190px;background:linear-gradient(135deg,var(--brand2),var(--brand) 60%,#2f9a68);display:flex;align-items:center;justify-content:center;position:relative}
.cover img{height:96px;max-width:70%;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,.25))}
.cover .fallback{color:#fff;font-weight:800;font-size:32px;letter-spacing:.5px}
.avatar-wrap{position:relative;width:128px;height:128px;margin:-64px 0 0 24px}
.avatar{width:128px;height:128px;border-radius:50%;border:5px solid #fff;background:var(--soft);object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;color:var(--brand);overflow:hidden}
.cam{position:absolute;right:2px;bottom:6px;width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;border:3px solid #fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cam input{display:none}
.must{position:absolute;top:-4px;left:-4px;background:#e11d48;color:#fff;border-radius:20px;font-size:10px;font-weight:700;padding:2px 8px}
.hero-body{padding:12px 24px 22px}
.name{font-size:1.5rem;font-weight:800;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.meta{color:var(--muted);font-size:14px;display:flex;gap:14px;flex-wrap:wrap;margin-top:4px}
.flag{width:22px;height:15px;object-fit:cover;border-radius:3px;box-shadow:0 0 0 1px var(--line);vertical-align:-2px}
.linkbox{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:12px;padding:8px 8px 8px 14px;margin-top:14px;font-size:13px}
.linkbox span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--brand2);font-weight:600}
.pc{background:#fff;border-radius:16px;padding:16px 18px;margin-top:16px;box-shadow:0 2px 12px rgba(20,35,28,.05)}
.progress{height:10px;border-radius:10px;background:var(--line)}
.progress-bar{background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:10px;transition:width .5s}
.todo{font-size:12px;background:var(--soft);color:var(--brand2);border-radius:20px;padding:3px 10px;display:inline-flex;gap:5px;align-items:center;margin:8px 6px 0 0;cursor:pointer;border:0}
.card-x{background:#fff;border-radius:16px;padding:18px;height:100%;box-shadow:0 2px 12px rgba(20,35,28,.05);border:1px solid transparent;transition:.2s}
.card-x:hover{border-color:var(--line);transform:translateY(-2px)}
.card-x h6{font-weight:800;display:flex;align-items:center;gap:9px;margin-bottom:14px}
.ic{width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--brand);display:inline-flex;align-items:center;justify-content:center}
.row-i{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.row-i:last-child{border:0}.row-i b{text-align:right}.row-i span{color:var(--muted)}
.btn-brand{background:var(--brand);color:#fff;border:0;font-weight:600}.btn-brand:hover{background:var(--brand2);color:#fff}
.form-switch .form-check-input{width:3em;height:1.5em;cursor:pointer}.form-check-input:checked{background-color:var(--brand);border-color:var(--brand)}
.sk{background:linear-gradient(90deg,#eef2f0,#f8faf9,#eef2f0);background-size:200%;animation:sh 1.2s infinite;border-radius:12px;height:120px}@keyframes sh{to{background-position:-200%}}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="employee-dashboard.html"><i class="bi bi-arrow-left"></i> Dashboard</a>
    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#editModal"><i class="bi bi-pencil-square"></i> Edit</button>
      <button class="btn btn-sm btn-brand" data-bs-toggle="offcanvas" data-bs-target="#settings"><i class="bi bi-gear"></i> Settings</button>
    </div>
  </div>
  <div id="app"><div class="sk mb-3" style="height:300px"></div><div class="sk"></div></div>
</div>

<!-- SETTINGS -->
<div class="offcanvas offcanvas-end" id="settings" tabindex="-1">
  <div class="offcanvas-header"><h5 class="fw-bold"><i class="bi bi-gear"></i> Settings</h5><button class="btn-close" data-bs-dismiss="offcanvas"></button></div>
  <div class="offcanvas-body">
    <div class="d-flex align-items-center gap-3 p-3 rounded-3 mb-3" style="background:var(--soft)">
      <div class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" id="visToggle2"></div>
      <div><div class="fw-bold" id="visLbl">Profile visibility</div><small class="text-muted">Employers can find you only when ON</small></div>
    </div>
    <label class="form-label small fw-semibold">Notifications</label>
    <select id="s-notif" class="form-select mb-3"><option value="all">All notifications</option><option value="important">Important only</option><option value="none">None</option></select>
    <button class="btn btn-brand w-100 mb-4" onclick="saveNotif()"><i class="bi bi-check-circle"></i> Save preference</button>
    <label class="form-label small fw-semibold">Change password</label>
    <input type="password" id="s-pw" class="form-control mb-2" placeholder="New password (min 8)">
    <input type="password" id="s-pw2" class="form-control mb-2" placeholder="Confirm password">
    <button class="btn btn-outline-secondary w-100 mb-4" onclick="changePw()"><i class="bi bi-lock"></i> Update password</button>
    <button class="btn btn-outline-danger w-100" onclick="signOut()"><i class="bi bi-box-arrow-left"></i> Sign out</button>
  </div>
</div>

<!-- EDIT -->
<div class="modal fade" id="editModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">
  <div class="modal-header"><h5 class="modal-title fw-bold"><i class="bi bi-person-gear"></i> Edit profile</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <div class="mb-3"><label class="form-label small fw-semibold">Full name</label><input id="e-name" class="form-control"></div>
    <div class="row g-2 mb-3">
      <div class="col-6"><label class="form-label small fw-semibold">Phone</label><input id="e-phone" class="form-control" placeholder="+254 7XX XXX XXX"></div>
      <div class="col-6"><label class="form-label small fw-semibold">Country</label><select id="e-country" class="form-select"></select></div>
    </div>
    <div class="mb-3"><label class="form-label small fw-semibold">Location / County</label><input id="e-loc" class="form-control" placeholder="e.g. Nairobi"></div>
    <div class="mb-3"><label class="form-label small fw-semibold">About / skills</label><textarea id="e-bio" rows="4" class="form-control" placeholder="Describe your skills and experience…"></textarea></div>
    <div class="row g-2">
      <div class="col-6"><label class="form-label small fw-semibold">Job type</label><select id="e-job" class="form-select"><option value="">Any</option><option value="fulltime">Full-time</option><option value="parttime">Part-time</option><option value="live-in">Live-in</option><option value="live-out">Live-out</option></select></div>
      <div class="col-6"><label class="form-label small fw-semibold">Expected salary (KES)</label><input id="e-salary" type="number" min="0" step="500" class="form-control"></div>
    </div>
  </div>
  <div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button class="btn btn-brand" id="saveBtn" onclick="saveProfile()"><i class="bi bi-check-circle"></i> Save</button></div>
</div></div></div>

<div id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><!-- window.SOUNDS_CONFIG = {supabaseUrl, supabaseKey, siteUrl?, logo?} -->
<script>
const CFG = window.SOUNDS_CONFIG || {};
const sb = supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey);
const SITE = (CFG.siteUrl || 'https://sounds.co.ke').replace(/\/$/, '');
const LOGO = CFG.logo || 'logo.png';           // SoundsCare logo used as the cover image
// Map of page fields -> worker_profiles columns. Change a value if your column is named differently.
const C = {name:'full_name', phone:'phone', loc:'location', bio:'bio', job:'preferred_job_type', salary:'expected_salary'};
const COUNTRIES = {KE:'Kenya',UG:'Uganda',TZ:'Tanzania',RW:'Rwanda',BI:'Burundi',SS:'South Sudan',ET:'Ethiopia',SO:'Somalia',ZM:'Zambia',MW:'Malawi',NG:'Nigeria',GH:'Ghana',ZA:'South Africa'};
let U, P;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function toast(msg, type='success') {
  const t = document.createElement('div');
  t.className = `alert alert-${type} shadow py-2 px-3 mb-0`; t.textContent = msg;
  $('toasts').appendChild(t); setTimeout(() => t.remove(), 3800);
}
const val = k => P[C[k]];
const photo = () => P.avatar_url || P.profile_photo || P.photo_url || '';
const link = () => `${SITE}/w/${P.public_slug || ''}`;

// ── Profile completion: each item is a weighted check; photo is weighted highest ──
function completion() {
  const items = [
    ['Profile photo', 25, !!photo(), 'photo'], ['Full name', 10, !!val('name'), 'edit'], ['Phone', 10, !!val('phone'), 'edit'],
    ['Location', 10, !!val('loc'), 'edit'], ['About / skills', 15, (val('bio')||'').length >= 30, 'edit'],
    ['Job type', 5, !!val('job'), 'edit'], ['Expected salary', 5, !!val('salary'), 'edit'],
    ['Verified', 20, !!(P.is_verified || P.verified || P.verification_status === 'verified'), null]
  ];
  return {items, pct: items.reduce((s, i) => s + (i[2] ? i[1] : 0), 0)};
}
const flagImg = cc => `<img class="flag" src="https://flagcdn.com/w40/${esc((cc||'ke').toLowerCase())}.png" alt="" onerror="this.outerHTML='<i class=&quot;bi bi-flag-fill&quot;></i>'">`;
const row = (k, v) => `<div class="row-i"><span>${k}</span><b>${v ? esc(v) : '<em class="text-muted fw-normal">Not set</em>'}</b></div>`;

function render() {
  const {items, pct} = completion();
  const cc = P.country_code || 'KE', verified = items[7][2], name = val('name') || 'Your name';
  const missing = items.filter(i => !i[2] && i[3] !== null);
  $('app').innerHTML = `
  <div class="hero">
    <div class="cover"><img src="${esc(LOGO)}" alt="SoundsCare" onerror="this.outerHTML='<div class=&quot;fallback&quot;>SoundsCare</div>'"></div>
    <div class="avatar-wrap">
      <div class="avatar">${photo() ? `<img src="${esc(photo())}" class="w-100 h-100" style="object-fit:cover" alt="">` : esc(name[0].toUpperCase())}</div>
      ${photo() ? '' : '<span class="must">REQUIRED</span>'}
      <label class="cam" title="Upload photo"><i class="bi bi-camera-fill"></i><input type="file" accept="image/*" onchange="uploadAvatar(this.files[0])"></label>
    </div>
    <div class="hero-body">
      <h1 class="name">${esc(name)} ${verified ? '<i class="bi bi-patch-check-fill text-success fs-5" title="Verified"></i>' : ''}
        <span class="badge ${P.is_visible ? 'text-bg-success' : 'text-bg-secondary'} fs-6 fw-semibold"><i class="bi bi-${P.is_visible ? 'eye' : 'eye-slash'}"></i> ${P.is_visible ? 'Visible' : 'Hidden'}</span></h1>
      <div class="meta"><span>${flagImg(cc)} ${esc(COUNTRIES[cc] || cc)}</span><span><i class="bi bi-geo-alt-fill"></i> ${esc(val('loc') || 'Location not set')}</span><span><i class="bi bi-envelope"></i> ${esc(U.email)}</span></div>
      <div class="linkbox"><i class="bi bi-link-45deg fs-5"></i><span id="plink">${esc(link())}</span>
        <button class="btn btn-sm btn-brand" onclick="copyLink()"><i class="bi bi-clipboard"></i> Copy</button>
        <button class="btn btn-sm btn-outline-secondary" onclick="shareLink()"><i class="bi bi-share"></i></button></div>
    </div>
  </div>

  <div class="pc">
    <div class="d-flex justify-content-between mb-2"><b><i class="bi bi-graph-up-arrow"></i> Profile completion</b><b>${pct}%</b></div>
    <div class="progress"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div>${missing.map(m => `<button class="todo" onclick="${m[3]==='photo' ? "document.querySelector('.cam input').click()" : "new bootstrap.Modal('#editModal').show()"}"><i class="bi bi-plus-circle"></i> ${m[0]} +${m[1]}%</button>`).join('') || '<small class="text-success"><i class="bi bi-stars"></i> Your profile is complete!</small>'}</div>
  </div>

  <div class="row g-3 mt-0">
    <div class="col-md-6"><div class="card-x"><h6><span class="ic"><i class="bi bi-person-lines-fill"></i></span>About</h6>
      <p class="mb-0" style="font-size:14px;line-height:1.7;color:${val('bio') ? 'inherit' : 'var(--muted)'}">${esc(val('bio') || 'Add a short summary of your skills and experience so employers can get to know you.')}</p></div></div>
    <div class="col-md-6"><div class="card-x"><h6><span class="ic"><i class="bi bi-telephone-fill"></i></span>Contact</h6>
      ${row('Email', U.email)}${row('Phone', val('phone'))}${row('Location', val('loc'))}${row('Country', COUNTRIES[cc] || cc)}</div></div>
    <div class="col-md-6"><div class="card-x"><h6><span class="ic"><i class="bi bi-briefcase-fill"></i></span>Work details</h6>
      ${row('Job type', val('job'))}${row('Expected salary', val('salary') ? 'KES ' + Number(val('salary')).toLocaleString() : '')}${row('Hiring status', P.is_hired ? 'Hired' : 'Available')}</div></div>
    <div class="col-md-6"><div class="card-x"><h6><span class="ic"><i class="bi bi-shield-check"></i></span>Visibility &amp; trust</h6>
      <div class="d-flex align-items-center gap-3 mb-2"><div class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" id="visToggle" ${P.is_visible ? 'checked' : ''}></div>
        <div><b id="visLbl1">${P.is_visible ? 'Visible to employers' : 'Hidden from employers'}</b><br><small class="text-muted">A notification is sent whenever this changes.</small></div></div>
      ${row('Verification', verified ? 'Verified' : 'Not verified')}${row('Member since', P.created_at ? new Date(P.created_at).toLocaleDateString(undefined,{year:'numeric',month:'short'}) : '')}</div></div>
  </div>`;
  $('visToggle').onchange = e => setVisible(e.target.checked);
  $('visToggle2').checked = !!P.is_visible; $('visToggle2').onchange = e => setVisible(e.target.checked);
  $('s-notif').value = P.notification_pref || 'all';
}

// ── Image upload: resize to 512px square JPEG, store at avatars/<uid>/avatar.jpg ──
async function uploadAvatar(file) {
  if (!file) return;
  if (!file.type.startsWith('image/')) return toast('Please choose an image file.', 'danger');
  if (file.size > 8 * 1024 * 1024) return toast('Image is too large (max 8 MB).', 'danger');
  toast('Uploading photo…', 'info');
  try {
    const bmp = await createImageBitmap(file), s = Math.min(bmp.width, bmp.height), cv = document.createElement('canvas');
    cv.width = cv.height = 512;
    cv.getContext('2d').drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, 512, 512);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .88));
    const path = `${U.id}/avatar.jpg`;
    const up = await sb.storage.from('avatars').upload(path, blob, {upsert: true, contentType: 'image/jpeg'});
    if (up.error) throw up.error;
    const url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl + '?v=' + Date.now();
    const {error} = await sb.from('worker_profiles').update({avatar_url: url}).eq('session_id', U.id);
    if (error) throw error;
    P.avatar_url = url; render(); toast('Profile photo updated');
  } catch (e) { toast('Upload failed: ' + (e.message || e), 'danger'); }
}

// ── Visibility → DB. The trigger (profile_enhancements.sql) stamps the change and sends the notification ──
async function setVisible(on) {
  if (on && !photo()) { render(); return toast('Add a profile photo before making your profile visible.', 'warning'); }
  const {error} = await sb.from('worker_profiles').update({is_visible: on}).eq('session_id', U.id);
  if (error) { render(); return toast('Could not update visibility: ' + error.message, 'danger'); }
  P.is_visible = on; render();
  toast(on ? 'Profile is now visible to employers' : 'Profile is now hidden from employers');
}

function openEdit() {
  $('e-name').value = val('name') || ''; $('e-phone').value = val('phone') || ''; $('e-loc').value = val('loc') || '';
  $('e-bio').value = val('bio') || ''; $('e-job').value = val('job') || ''; $('e-salary').value = val('salary') || '';
  $('e-country').value = P.country_code || 'KE';
}
async function saveProfile() {
  const name = $('e-name').value.trim();
  if (!name) return toast('Full name is required.', 'danger');
  const upd = {[C.name]: name, [C.phone]: $('e-phone').value.trim(), [C.loc]: $('e-loc').value.trim(), [C.bio]: $('e-bio').value.trim(),
    [C.job]: $('e-job').value || null, [C.salary]: $('e-salary').value ? Number($('e-salary').value) : null, country_code: $('e-country').value};
  $('saveBtn').disabled = true;
  const {error} = await sb.from('worker_profiles').update(upd).eq('session_id', U.id);
  $('saveBtn').disabled = false;
  if (error) return toast('Save failed: ' + error.message, 'danger');
  Object.assign(P, upd); bootstrap.Modal.getInstance($('editModal')).hide(); render(); toast('Profile saved');
}
async function saveNotif() {
  const v = $('s-notif').value, {error} = await sb.from('worker_profiles').update({notification_pref: v}).eq('session_id', U.id);
  error ? toast(error.message, 'danger') : (P.notification_pref = v, toast('Notification preference saved'));
}
async function changePw() {
  const a = $('s-pw').value, b = $('s-pw2').value;
  if (a.length < 8) return toast('Password must be at least 8 characters.', 'danger');
  if (a !== b) return toast('Passwords do not match.', 'danger');
  const {error} = await sb.auth.updateUser({password: a});
  error ? toast(error.message, 'danger') : (toast('Password updated'), $('s-pw').value = $('s-pw2').value = '');
}
const signOut = async () => { await sb.auth.signOut(); location.href = 'index.html'; };
async function copyLink() { try { await navigator.clipboard.writeText(link()); toast('Profile link copied'); } catch { toast(link(), 'info'); } }
function shareLink() { navigator.share ? navigator.share({title: val('name') + ' on SoundsCare', url: link()}).catch(() => {}) : copyLink(); }

(async function init() {
  $('e-country').innerHTML = Object.entries(COUNTRIES).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
  $('editModal').addEventListener('show.bs.modal', openEdit);
  const {data: {session}} = await sb.auth.getSession();
  if (!session) return location.href = 'index.html';
  U = session.user;
  const {data, error} = await sb.from('worker_profiles').select('*').eq('session_id', U.id).maybeSingle();
  if (error || !data) { $('app').innerHTML = `<div class="alert alert-warning">Could not load your profile${error ? ': ' + esc(error.message) : ''}. If this is new, run <code>profile_enhancements.sql</code> first.</div>`; return; }
  P = data; if (P.is_visible == null) P.is_visible = true;
  render();
})();
</script>
</body>
</html>

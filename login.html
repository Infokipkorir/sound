<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — SoundsCare Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/buttons.css">
</head>
<body>
<div id="auth-overlay">
  <div class="auth-card">
    <div class="auth-logo-wrap">
      <div class="auth-logo">
        <img src="assets/sound_logo.png" alt="SoundsCare" onerror="this.style.display='none';this.parentElement.innerHTML='<span style=\'font-size:28px\'>🎙️</span>'">
      </div>
      <h1>SoundsCare Admin</h1>
      <p class="auth-sub">Control Centre — Authorised access only</p>
    </div>
    <div class="auth-error" id="auth-error"></div>
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Username</label>
        <input id="auth-email" type="text" placeholder="admin" autocomplete="username" required style="font-size:13px">
      </div>
      <div class="form-group" style="position:relative">
        <label>Password</label>
        <input id="auth-password" type="password" placeholder="••••••••" autocomplete="current-password" required style="font-size:13px;padding-right:40px">
        <button type="button" onclick="toggleAdminPw()" style="position:absolute;right:10px;bottom:10px;background:none;border:none;cursor:pointer;color:var(--muted);font-size:15px;padding:2px" title="Show/hide">
          <i class="bi bi-eye" id="auth-eye"></i>
        </button>
      </div>
      <button type="submit" class="btn btn-primary" id="auth-submit-btn" style="width:100%;justify-content:center;margin-top:.3rem;padding:11px">
        <span id="auth-btn-spinner" style="display:none;width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .65s linear infinite;margin-right:6px"></span>
        <i class="bi bi-box-arrow-in-right" id="auth-btn-icon"></i>
        <span id="auth-btn-text">Sign In to Dashboard</span>
      </button>
    </form>
    <p style="text-align:center;font-size:11.5px;color:var(--muted);margin-top:1.2rem">
      <i class="bi bi-shield-lock" style="margin-right:4px"></i>Secured connection — admin only
    </p>
  </div>
</div>

<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<script>
// If already signed in, skip straight to the dashboard (or the page they were headed to)
(async()=>{
  const stored = localStorage.getItem('sc_admin_session');
  if(!stored) return;
  try{
    const sess = JSON.parse(stored);
    const {data} = await sb.from('admin_users').select('id').eq('id',sess.id).eq('status','Active').maybeSingle();
    if(data) redirectAfterLogin();
  }catch(e){}
})();

function redirectAfterLogin(){
  const params = new URLSearchParams(location.search);
  const next = params.get('next');
  location.href = next ? decodeURIComponent(next) : 'dashboard.html';
}

async function handleLogin(e){
  e.preventDefault();
  const username = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.textContent = '';
  errEl.classList.remove('show');

  const btn = document.getElementById('auth-submit-btn');
  const spinner = document.getElementById('auth-btn-spinner');
  const icon = document.getElementById('auth-btn-icon');
  const txt = document.getElementById('auth-btn-text');
  btn.disabled = true;
  spinner.style.display = 'inline-block';
  icon.style.display = 'none';
  txt.textContent = 'Signing in…';

  const showErr = (msg) => {
    errEl.textContent = msg;
    errEl.classList.add('show');
    btn.disabled = false;
    spinner.style.display = 'none';
    icon.style.display = '';
    txt.textContent = 'Sign In to Dashboard';
  };

  try {
    const { data, error } = await sb.from('admin_users')
      .select('*')
      .eq('username', username)
      .eq('password', password)
      .eq('status', 'Active')
      .maybeSingle();
    if (error) throw error;
    if (!data) { showErr('Invalid username or password.'); return; }
    localStorage.setItem('sc_admin_session', JSON.stringify({ id: data.id, username: data.username, role: data.role, badge: data.badge }));
    redirectAfterLogin();
  } catch(err) { showErr(err.message || 'Sign in failed. Please try again.'); }
}
function toggleAdminPw(){
  const inp = document.getElementById('auth-password');
  const icon = document.getElementById('auth-eye');
  if(inp.type === 'password'){ inp.type = 'text'; icon.className = 'bi bi-eye-slash'; }
  else { inp.type = 'password'; icon.className = 'bi bi-eye'; }
}
</script>
</body>
</html>

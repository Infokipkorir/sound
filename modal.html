<div id="lightbox-overlay" class="hidden">
  <div class="lightbox-stage">
    <button class="lightbox-close" onclick="closeLightbox()" title="Close"><i class="bi bi-x-lg"></i></button>
    <button class="lightbox-nav lightbox-prev" onclick="lightboxNav(-1)" title="Previous"><i class="bi bi-chevron-left"></i></button>
    <img id="lightbox-img" src="" alt="Document preview">
    <button class="lightbox-nav lightbox-next" onclick="lightboxNav(1)" title="Next"><i class="bi bi-chevron-right"></i></button>
    <div class="lightbox-caption" id="lightbox-caption"></div>
    <div class="lightbox-actions">
      <a class="btn btn-secondary btn-sm" id="lightbox-download" href="#" download><i class="bi bi-download"></i> Download</a>
      <a class="btn btn-secondary btn-sm" id="lightbox-newtab" href="#" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right"></i> Open in new tab</a>
    </div>
  </div>
</div>

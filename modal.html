<!-- IMAGE LIGHTBOX — view uploaded documents/photos without leaving the page.
     Page-specific modals (profile modals, confirm dialogs, etc.) stay defined
     inline in each page since their content differs per page. This is the one
     modal genuinely shared everywhere, so it lives here and is included once. -->
<div id="lightbox-overlay" class="hidden" onclick="if(event.target===this)closeLightbox()">
  <div class="lightbox-stage">
    <button class="lightbox-close" onclick="closeLightbox()" title="Close (Esc)"><i class="bi bi-x-lg"></i></button>
    <button class="lightbox-nav lightbox-prev" onclick="lightboxNav(-1)" title="Previous"><i class="bi bi-chevron-left"></i></button>
    <img id="lightbox-img" src="" alt="Document preview">
    <button class="lightbox-nav lightbox-next" onclick="lightboxNav(1)" title="Next"><i class="bi bi-chevron-right"></i></button>
    <div class="lightbox-caption" id="lightbox-caption"></div>
    <div class="lightbox-actions">
      <a id="lightbox-download" class="btn btn-sm btn-secondary" download><i class="bi bi-download"></i> Download</a>
      <a id="lightbox-newtab" class="btn btn-sm btn-secondary" target="_blank"><i class="bi bi-box-arrow-up-right"></i> Open Original</a>
    </div>
  </div>
</div>

<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments — SoundsCare Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/sidebar.css"><link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/modal.css"><link rel="stylesheet" href="css/tables.css"><link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/forms.css"><link rel="stylesheet" href="css/responsive.css">
</head><body data-page="payments">
<div id="maintenance-banner"><i class="bi bi-exclamation-triangle-fill"></i> Maintenance mode is ON.</div>
<div data-include="sidebar"></div>
<div class="main" id="main">
  <div data-include="topbar"></div>
  <div class="content">
    <div class="page-head"><div><h1>Payments</h1><p id="pay-subtitle">All transactions</p></div>
      <a class="btn btn-secondary btn-sm" href="payments.html" id="pay-clear-filter" style="display:none"><i class="bi bi-x-lg"></i> Clear filter</a></div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Total Collected</div><div class="stat-value accent" id="pay-total">—</div></div>
      <div class="stat-card"><div class="stat-label">Completed</div><div class="stat-value" id="pay-completed">—</div></div>
      <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value amber" id="pay-pending">—</div></div>
      <div class="stat-card"><div class="stat-label">Failed</div><div class="stat-value rose" id="pay-failed">—</div></div>
    </div>
    <div class="section">
      <div class="search-bar">
        <input class="search-input" id="pay-search" placeholder="🔍 Search transaction ID, phone…" oninput="filterPayments()">
        <select class="filter-select" id="pay-status-filter" onchange="filterPayments()">
          <option value="">All Statuses</option><option value="completed">Completed</option><option value="pending">Pending</option><option value="failed">Failed</option>
        </select>
        <select class="filter-select" id="pay-type-filter" onchange="filterPayments()"><option value="">All Fee Types</option></select>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Transaction</th><th>Fee Type</th><th>Amount</th><th>Method</th><th>Status</th><th>Date</th></tr></thead>
      <tbody id="pay-tbody"><tr><td colspan="6" style="text-align:center">Loading…</td></tr></tbody></table></div>
      <div class="pagination" id="pay-pagination"></div>
    </div>
  </div>
</div>
<div data-include="modal"></div><div data-include="toast"></div>
<script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/layout.js"></script>
<script src="js/auth.js"></script><script src="js/api.js"></script><script src="js/payments.js"></script>
<script>(async function(){await initLayout();const admin=await requireAuth();if(!admin)return;await initPaymentsPage();})();</script>
</body></html>

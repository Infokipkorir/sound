<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — SoundsCare Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="css/dashboard.css"><link rel="stylesheet" href="css/sidebar.css"><link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/modal.css"><link rel="stylesheet" href="css/tables.css"><link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/forms.css"><link rel="stylesheet" href="css/responsive.css">
<style>
.msg-layout{display:grid;grid-template-columns:320px 1fr;gap:1rem;height:70vh}
.msg-list{overflow-y:auto;border:1px solid var(--border);border-radius:10px}
.msg-list-item{padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.msg-list-item:hover,.msg-list-item.active{background:var(--brand-soft)}
.msg-thread{border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column}
.msg-thread-body{flex:1;overflow-y:auto;padding:14px}
</style>
</head><body data-page="messages">
<div id="maintenance-banner"><i class="bi bi-exclamation-triangle-fill"></i> Maintenance mode is ON.</div>
<div data-include="sidebar"></div>
<div class="main" id="main">
  <div data-include="topbar"></div>
  <div class="content">
    <div class="page-head"><div><h1>Messages</h1><p>Conversations between employers and job seekers</p></div></div>
    <div class="msg-layout">
      <div class="msg-list" id="conv-list">Loading…</div>
      <div class="msg-thread">
        <div class="msg-thread-body" id="msg-thread-body"><p style="color:var(--muted);text-align:center;margin-top:2rem">Select a conversation</p></div>
      </div>
    </div>
  </div>
</div>
<div data-include="modal"></div><div data-include="toast"></div>
<script src="js/supabase.js"></script><script src="js/utils.js"></script><script src="js/layout.js"></script>
<script src="js/auth.js"></script><script src="js/api.js"></script><script src="js/messages.js"></script>
<script>(async function(){await initLayout();const admin=await requireAuth();if(!admin)return;await initMessagesPage();})();</script>
</body></html>
